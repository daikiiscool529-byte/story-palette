<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StoryPalette</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f8edf2;
      text-align: center;
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    .story {
      width: 270px;
      height: 480px;
      background: #e9dfce;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    .story img {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .storyTextItem {
      touch-action: none;
      position: absolute;
      left: 50%;
      top: 400px;
      width: max-content;
      max-width: 240px;
      margin: 0;
      padding: 0;
      color: #555555;
      font-size: 15px;
      font-family: sans-serif;
      line-height: 1.2;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      touch-action: none;
      cursor: grab;
      user-select: none;
      transform: translateX(-50%);
    }

    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }

    input {
      margin: 10px;
    }

    /* 編集タブ */
    .editTabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 20px auto 10px;
      max-width: 360px;
    }

    .tabButton {
      flex: 1;
      padding: 12px 5px;
      border: none;
      border-radius: 12px 12px 0 0;
      background: #eadde5;
      color: #665260;
      font-size: 14px;
    }

    .tabButton.active {
      background: white;
      color: #a65d87;
      font-weight: bold;
    }

    .tabContent {
      display: none;
      background: white;
      padding: 16px 10px;
      border-radius: 12px;
      max-width: 340px;
      margin: 0 auto;
    }

    .tabContent.active {
      display: block;
    }

    .tabContent textarea {
      width: 85%;
      max-width: 280px;
      padding: 8px;
      box-sizing: border-box;
    }

    .saveButton {
      background: #a87898;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 15px;
    }

    /* スマホ向けデザイン */
    .editTabs {
      width: 100%;
      max-width: 360px;
      gap: 6px;
      padding: 0 4px;
    }

    .tabButton {
      min-height: 48px;
      margin: 0;
      padding: 12px 4px;
      font-size: 14px;
      border-radius: 12px 12px 0 0;
    }

    .tabContent {
      width: 100%;
      max-width: 360px;
      padding: 20px 12px;
      border-radius: 0 0 14px 14px;
    }

    .tabContent p {
      font-size: 14px;
      font-weight: 500;
      color: #665260;
    }

    .tabContent input[type="range"] {
      width: 85%;
      max-width: 280px;
      accent-color: #a87898;
    }

    .tabContent input[type="file"] {
      max-width: 100%;
      font-size: 13px;
    }

    .tabContent select,
    .tabContent textarea {
      max-width: 100%;
      font-size: 16px;
      border: 1px solid #e5d6df;
      border-radius: 8px;
      padding: 10px;
    }

    .tabContent button {
      min-height: 44px;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #f0e4eb;
      color: #665260;
    }

    .saveButton {
      display: block;
      width: 100%;
      max-width: 360px;
      min-height: 50px;
      margin: 20px auto;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      background: #a87898;
      color: white;
    }

    /* 小さいスマホ向け */
    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .tabButton {
        font-size: 12px;
      }
    }

    /* 文字の縁取り */
    .storyTextItem {
      -webkit-text-stroke: 0px;
      paint-order: stroke fill;
    }

    /* 文字の影 */
    .story.shadow {
      text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.6);
    }

    /* 選択中の文字 */
    .storyTextItem.selected {
      outline: 1px dashed rgba(0, 0, 0, 0.5);
      outline-offset: 3px;
    }

    /* 文字一覧 */
    #textList button {
      margin: 4px;
      padding: 8px 12px;
    }

    #textList button.active {
      background: #a87898;
      color: white;
    }

    .storyPhotoItem.selected {
      outline: 2px dashed #a87898;
      outline-offset: 3px;
    }

    #photoList button {
      margin: 4px;
      padding: 8px 12px;
    }

    #photoList button.active {
      background: #a87898;
      color: white;
    }

    .addPhotoButton {
      display: inline-block;
      background: #a87898;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 12px auto;
    }

    /* 元に戻す・やり直すボタン */
    .historyControls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px auto;
    }

    .historyControls button {
      background: #a87898;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
    }

    .historyControls button:disabled {
      background: #ddd;
      color: #999;
      cursor: not-allowed;
    }

    /* 新規作成ボタン */
    .newStoryControls {
      text-align: center;
      margin: 12px auto;
    }

    .newStoryControls button {
      background: #f0e4eb;
      color: #8c526f;
      border: 1px solid #d8b9ca;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 共通削除ボタン */
    .deleteControls {
      display: flex;
      justify-content: center;
      margin: 12px auto;
    }

    .deleteControls button {
      background: #fff0f3;
      color: #c04f68;
      border: 1px solid #efb9c5;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 選択されていないときの削除ボタン */
    .deleteControls button:disabled {
      background: #eeeeee;
      color: #999999;
      border-color: #dddddd;
      cursor: not-allowed;
    }

    /* 中央配置のガイドライン */
    .centerGuide {
      position: absolute;
      display: none;
      background: #e05b97;
      z-index: 9999;
      pointer-events: none;
    }

    .centerGuide.vertical {
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
    }

    .centerGuide.horizontal {
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
    }

    /* 写真・文字の整列ボタン */
    .alignControls {
      max-width: 360px;
      margin: 15px auto;
      padding: 12px;
      background: white;
      border-radius: 12px;
    }

    .alignControls p {
      color: #665260;
      font-size: 14px;
      font-weight: bold;
    }

    .alignControls button {
      background: #f0e4eb;
      color: #665260;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }

    /* ロックボタン */
    .lockControls {
      margin: 12px auto;
      text-align: center;
    }

    .lockControls button {
      background: #f0e4eb;
      color: #665260;
      border: 1px solid #d8b9ca;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: bold;
    }

    /* ロック中の選択表示 */
    .storyPhotoItem.selected[data-locked="true"],
    .storyTextItem.selected[data-locked="true"] {
      outline: 2px solid #8c526f;
    }

    /* ロック中のスライダー */
    #photoSize:disabled,
    #textSize:disabled,
    #textRotation:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(100%);
    }

    /* ロックした項目を選択中は鍵マークを表示 */
    .story:has(.storyPhotoItem.selected[data-locked="true"],
      .storyTextItem.selected[data-locked="true"])::after {
      content: "🔒";
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 20px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      padding: 5px;
      z-index: 10000;
      pointer-events: none;
    }

    /* 詳細ツールの開閉ボタン */
    .toolToggleControls {
      max-width: 360px;
      margin: 12px auto;
      text-align: center;
    }

    .toolToggleControls button {
      width: 100%;
      background: #f0e4eb;
      color: #665260;
      border: 1px solid #d8b9ca;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 最初は詳細ツールを折りたたむ */
    #editorArea.toolsCollapsed .alignControls,
    #editorArea.toolsCollapsed .lockControls {
      display: none;
    }

    /* 写真・文字一覧の折りたたみ */
    .editorAccordion {
      background: #f8f0f5;
      border: 1px solid #ead8e3;
      border-radius: 10px;
      margin: 12px auto;
      padding: 0;
      overflow: hidden;
    }

    .editorAccordion summary {
      padding: 14px;
      color: #665260;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .editorAccordion[open] summary {
      border-bottom: 1px solid #ead8e3;
    }

    .editorAccordion #photoList,
    .editorAccordion #textList {
      padding: 10px;
    }

    /* 文字の装飾設定 */
    .textDecorationAccordion {
      margin-top: 18px;
    }

    .decorationSettings {
      padding: 14px;
      text-align: left;
    }

    .decorationSettings>label {
      display: block;
      margin: 12px 0;
      color: #665260;
      font-size: 14px;
    }

    .decorationSettings>div {
      margin: 14px 0;
    }

    .decorationSettings>div label {
      display: block;
      margin-bottom: 6px;
      color: #665260;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>StoryPalette</h1>
  <p>写真を選んでストーリーを作ろう！</p>
  <div id="editorArea">
    <!-- 編集用ストーリー表示 -->
    <div class="story">
    </div>
    <!-- 編集タブ -->
    <!-- 元に戻す・やり直す -->
    <!-- 選択した写真・文字を削除 -->
    <!-- 選択した写真・文字を削除 -->
    <div class="deleteControls">
      <button type="button" id="deleteSelectedButton" onclick="deleteSelectedItem()" disabled>
        🗑️ 写真か文字を選択してね
      </button>
    </div>
    <!-- 写真・文字の整列 -->

    <!-- 詳細ツールの開閉ボタン -->
    <div class="toolToggleControls">
      <button type="button" id="toolToggleButton" onclick="toggleAdvancedTools()" aria-expanded="false">
        ⚙️ 詳細ツールを表示 ▼
      </button>
    </div>

    <div class="alignControls">
      <p>選択した写真・文字の位置を揃える</p>
      <div>
        <button type="button" onclick="alignSelectedItem('left')">
          左揃え
        </button>
        <button type="button" onclick="alignSelectedItem('centerX')">
          左右中央
        </button>
        <button type="button" onclick="alignSelectedItem('right')">
          右揃え
        </button>
      </div>
      <div>
        <button type="button" onclick="alignSelectedItem('top')">
          上揃え
        </button>
        <button type="button" onclick="alignSelectedItem('centerY')">
          上下中央
        </button>
        <button type="button" onclick="alignSelectedItem('bottom')">
          下揃え
        </button>
      </div>
    </div>
    <!-- 写真・文字のロック -->
    <div class="lockControls">
      <button type="button" onclick="toggleItemLock()">
        🔒 選択した項目を固定・解除
      </button>
    </div>
    <div class="historyControls">
      <button type="button" id="undoButton" disabled>
        ↶ 元に戻す
      </button>
      <button type="button" id="redoButton" disabled>
        ↷ やり直す
      </button>
    </div>
    <!-- 新しいストーリーを作る -->
    <div class="newStoryControls">
      <button type="button" onclick="newStory()">
        ＋ 新規作成
      </button>
    </div>
    <div class="editTabs">
      <button type="button" class="tabButton active" onclick="showTab('photo', this)">📷 写真</button>
      <button type="button" class="tabButton" onclick="showTab('text', this)">✏️ 文字</button>
      <button type="button" class="tabButton" onclick="showTab('background', this)">🎨 背景</button>
    </div>
    <!-- 写真タブ -->
    <div id="photoTab" class="tabContent active">
      <label for="photo" class="addPhotoButton">
        ＋ 写真を追加
      </label>
      <input type="file" accept="image/*" id="photo" style="display:none;">
      <p>写真の大きさ</p>
      <input type="range" id="photoSize" min="10" max="400" value="100" oninput="changeSize()">

      <details class="editorAccordion">
        <summary>📷 追加した写真の一覧</summary>

        <div id="photoList"></div>
      </details>

      <button type="button" onclick="duplicatePhoto()">
        写真を複製
      </button> <button type="button" onclick="removePhoto()">
        選択した写真を削除
      </button>
      <div>
        <button type="button" onclick="movePhotoForward()">
          選択した写真を前面へ
        </button>
        <button type="button" onclick="movePhotoBackward()">
          選択した写真を背面へ
        </button>
      </div>
      <p>写真と文字の重なり順</p> <button type="button" onclick="changePhotoLayerWithHistory('back')">
        写真を背面へ
      </button>
      <button type="button" onclick="changePhotoLayerWithHistory('front')">
        写真を前面へ
      </button>
    </div>
    <!-- 文字タブ -->
    <div id="textTab" class="tabContent">
      <!-- 複数文字の管理 -->

      <details class="editorAccordion">
        <summary>✏️ 文字の一覧</summary>

        <div id="textList"></div>
      </details>

      <button type="button" onclick="addText()">＋ 文字を追加</button>
      <button type="button" onclick="duplicateText()">文字を複製</button>
      <button type="button" onclick="removeText()">選択した文字を削除</button>
      <p>ストーリーに入れる文字</p>
      <textarea id="storyText" rows="3" oninput="changeText()"></textarea>
      <p>文字の色</p>
      <input type="color" id="textColor" value="#555555" oninput="changeTextColor()">
      <p>文字の大きさ</p>
      <input type="range" id="textSize" min="10" max="40" value="15" oninput="changeTextSize()">
      <div>
        <label for="textRotation">文字の回転：<span id="rotationValue">0°</span></label>
        <input type="range" id="textRotation" min="-180" max="180" value="0" oninput="changeTextRotation()">
      </div>
      <p>文字のフォント</p>
      <select id="textFont" onchange="changeTextFont()">
        <option value="sans-serif">ゴシック体</option>
        <option value="serif">明朝体</option>
        <option value="cursive">筆記体</option>
        <option value="monospace">等幅フォント</option>
      </select>
      <!-- 文字の装飾 -->
      <p>文字の装飾</p>

      <!-- 文字の装飾 -->
      <details class="editorAccordion textDecorationAccordion">
        <summary>✨ 文字の装飾・詳細設定</summary>

        <div class="decorationSettings">

          <label>
            <input type="checkbox" id="textOutline" onchange="changeTextStyle()">
            縁取りをつける
          </label>

          <div>
            <label for="outlineColor">縁取りの色</label>
            <input type="color" id="outlineColor" value="#333333" oninput="changeTextStyle()">
          </div>

          <div>
            <label for="outlineWidth">縁取りの太さ</label>
            <input type="range" id="outlineWidth" min="1" max="8" value="2" oninput="changeTextStyle()">
          </div>

          <label>
            <input type="checkbox" id="textShadow" onchange="changeTextStyle()">
            影をつける
          </label>


        </div>
      </details>

    </div> <!-- 背景タブ -->

    <div id="backgroundTab" class="tabContent">
      <p>背景の色</p>
      <button onclick="changeColor('#f8c8dc')">ピンク</button>
      <button onclick="changeColor('#c8e7ff')">水色</button>
      <button onclick="changeColor('#e9dfce')">ベージュ</button>
      <!-- 自由に背景色を選択 -->
      <p>好きな色を選ぶ</p> <input type="color" id="backgroundColor" value="#e9dfce" onchange="changeColor(this.value)">
    </div> <!-- 保存ボタン（どのタブでも表示） -->
    <br>
    <button onclick="saveStory()" class="saveButton">
      画像を保存する
    </button>
  </div> <!-- editorAreaを閉じる -->
  <!-- 完成画像の表示画面 -->
  <div id="saveArea" style="display:none; margin:20px auto;">
    <p>完成した画像を長押しして保存してね！</p>
    <img id="savedImage" alt="完成したストーリー" style="width:270px; max-width:100%;">
    <br>
    <button onclick="backToEdit()">
      ← 編集に戻る
    </button>
  </div>
  <script>
    const photo = document.getElementById("photo");
    let selectedPhoto = null;
    let photoCounter = 0;
    const photoList = document.getElementById("photoList");
    photo.classList.add("photoUpload");
    photo.addEventListener("change", function () {
      const file = photo.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        alert("画像ファイルを選択してください");
        return;
      }
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = document.createElement("img");
        img.className = "storyPhotoItem";
        img.alt = "追加した写真";
        img.draggable = false;
        img.style.display = "block";
        img.dataset.x = "0";
        img.dataset.y = "0";
        img.dataset.size = "100";
        img.dataset.name = "写真 " + (++photoCounter);
        img.onload = function () {
          updatePhotoItem(img);
        };
        img.src = event.target.result;
        // 写真を追加する前の状態を保存
        saveHistory();
        storyArea.appendChild(img);
        enablePhotoDrag(img);
        selectPhoto(img);
        setPhotoLayer(photoLayer);
      };
      reader.onerror = function () {
        alert("写真の読み込みに失敗しました");
      };
      reader.readAsDataURL(file);
      // 同じ写真を続けて追加できるようにする
      photo.value = "";
    });
    function selectPhoto(img) {
      document.querySelectorAll(".storyPhotoItem").forEach(function (item) {
        item.classList.remove("selected");
      });
      selectedPhoto = img;
      // 文字の選択を解除する
      document.querySelectorAll(".storyTextItem").forEach(function (el) {
        el.classList.remove("selected");
      });
      selectedText = null;
      refreshTextList();
      if (img) {
        img.classList.add("selected");
        document.getElementById("photoSize").value =
          img.dataset.size || "100";
      }
      refreshPhotoList();
    }
    function refreshPhotoList() {
      photoList.innerHTML = "";
      document.querySelectorAll(".storyPhotoItem").forEach(function (img, index) {
        const button = document.createElement("button");
        button.type = "button";
        const lockIcon =
          img.dataset.locked === "true" ? "🔒 " : "";
        button.textContent =
          lockIcon +
          (index + 1) + "： " +
          (img.dataset.name || "写真 " + (index + 1));
        if (img === selectedPhoto) {
          button.classList.add("active");
        }
        button.addEventListener("click", function () {
          selectPhoto(img);
        });
        photoList.appendChild(button);
      });
    } function updatePhotoItem(img) {
      if (!img.naturalWidth) return;
      const size = Number(img.dataset.size || 100) / 100;
      const rotation = Number(img.dataset.rotation || 0);
      const scale = Math.min(
        220 / img.naturalWidth,
        320 / img.naturalHeight
      ) * size;
      img.style.width = (img.naturalWidth * scale) + "px";
      img.style.height = (img.naturalHeight * scale) + "px";
      const x = Number(img.dataset.x || 0);
      const y = Number(img.dataset.y || 0);
      img.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotation}deg)`;
    }
    function enablePhotoDrag(img) {
      const pointers = new Map();
      // 1回の指操作で履歴を1つだけ保存する
      let gestureHistorySaved = false;
      let startX = 0;
      let startY = 0;
      let startDistance = 0;
      let startAngle = 0;
      let startSize = 100;
      let startRotation = 0;
      function getDistance(a, b) {
        return Math.hypot(b.x - a.x, b.y - a.y);
      }
      function getAngle(a, b) {
        return Math.atan2(
          b.y - a.y,
          b.x - a.x
        ) * 180 / Math.PI;
      }
      img.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        selectPhoto(img);
        // ロック中は指で動かせない
        if (img.dataset.locked === "true") {
          return;
        }
        pointers.set(e.pointerId, {
          x: e.clientX,
          y: e.clientY
        });
        img.setPointerCapture(e.pointerId);
        if (pointers.size === 1) {
          startX = e.clientX - Number(img.dataset.x || 0);
          startY = e.clientY - Number(img.dataset.y || 0);
        }
        if (pointers.size === 2) {
          const [a, b] = [...pointers.values()];
          startDistance = getDistance(a, b);
          startAngle = getAngle(a, b);
          startSize = Number(img.dataset.size || 100);
          startRotation = Number(img.dataset.rotation || 0);
        }
      });
      img.addEventListener("pointermove", function (e) {
        const previousPoint = pointers.get(e.pointerId);
        if (!previousPoint) return;
        // 指が実際に動いたときだけ処理する
        if (
          previousPoint.x === e.clientX &&

        const shadows = [];
        for (let x = -width; x <= width; x++) {
          for (let y = -width; y <= width; y++) {
            if (x * x + y * y <= width * width) {
              shadows.push(`${x}px ${y}px 0 ${color}`);
            }
          }
        }
        el.style.webkitTextStroke = "0px";
        el.style.textShadow = shadows.join(", ");
      } else {
        el.style.textShadow = "";
      }
      if (el.classList.contains("shadow")) {
        const existing = el.style.textShadow;
        el.style.textShadow =
          (existing ? existing + ", " : "") +
          "2px 2px 4px rgba(0,0,0,0.6)";
      }
    } function showTab(tabName, clickedButton) {
      // すべてのタブ内容を非表示
      document.querySelectorAll(".tabContent").forEach(function (tab) {
        tab.classList.remove("active");
      });
      // すべてのタブボタンの選択状態を解除
      document.querySelectorAll(".tabButton").forEach(function (button) {
        button.classList.remove("active");
      });
      // 選択したタブを表示
      document.getElementById(tabName + "Tab").classList.add("active");
      // 押したボタンを選択状態にする
      clickedButton.classList.add("active");
    }
    /* 写真サイズのスライダー操作を履歴に保存 */
    const photoSizeSlider = document.getElementById("photoSize");
    // 指やマウスで操作を始めたとき
    photoSizeSlider.addEventListener("pointerdown", function () {
      if (!selectedPhoto) return;
      saveHistory();
    });
    // キーボードでサイズを変更するとき
    photoSizeSlider.addEventListener("keydown", function (e) {
      if (!selectedPhoto) return;
      const keys = [
        "ArrowLeft", "ArrowRight",
        "ArrowUp", "ArrowDown",
        "Home", "End",
        "PageUp", "PageDown"
      ];
      // 対象キーを押し始めた瞬間だけ履歴を保存
      if (keys.includes(e.key) && !e.repeat) {
        saveHistory();
      }
    });
    /* 文字入力の履歴 */
    const storyTextInput = document.getElementById("storyText");
    let textTypingHistorySaved = false;
    // 文字を書き始める前の状態を保存
    storyTextInput.addEventListener("beforeinput", function () {
      if (!selectedText || textTypingHistorySaved) return;
      saveHistory();
      textTypingHistorySaved = true;
    });
    // 入力欄から離れたら、次の編集に備える
    storyTextInput.addEventListener("blur", function () {
      textTypingHistorySaved = false;
    });
    /* 文字のデザイン変更履歴 */
    const textHistoryControls = [
      "textColor",
      "textSize",
      "textRotation",
      "textFont",
      "textOutline",
      "outlineColor",
      "outlineWidth",
      "textShadow"
    ];
    textHistoryControls.forEach(function (id) {
      const control = document.getElementById(id);
      // タッチ・マウス操作の直前に保存
      control.addEventListener("pointerdown", function () {
        if (!selectedText) return;
        saveHistory();
      });
      // キーボード操作の直前に保存
      control.addEventListener("keydown", function (e) {
        const keys = [
          "ArrowLeft", "ArrowRight",
          "ArrowUp", "ArrowDown",
          "Home", "End",
          "PageUp", "PageDown",
          " ", "Enter"
        ];
        if (keys.includes(e.key) && !e.repeat) {
          saveHistory();
        }
      });
    });
    /* 編集データの自動保存 */
    let storyDraftDB = null;
    let storyDraftTimer = null;
    let draftSaveWarningShown = false;
    // 現在の編集状態を保存
    function saveStoryDraft() {
      if (!storyDraftDB) return;
      try {
        const state = JSON.stringify(getEditorState());
        const transaction = storyDraftDB.transaction(
          "drafts",
          "readwrite"
        );
        transaction.objectStore("drafts").put(
          state,
          "latest"
        );
        transaction.onerror = function () {
          if (!draftSaveWarningShown) {
            alert("自動保存に失敗しました。写真の容量が大きい可能性があります。");
            draftSaveWarningShown = true;
          }
        };
      } catch (error) {
        console.error("自動保存エラー:", error);
      }
    }
    // 編集が落ち着いてから保存する
    function scheduleStoryDraftSave() {
      clearTimeout(storyDraftTimer);
      storyDraftTimer = setTimeout(function () {
        saveStoryDraft();
      }, 1000);
    }
    // 写真や文字の変更を監視
    function startStoryDraftWatching() {
      const story = document.querySelector(".story");
      const observer = new MutationObserver(function () {
        scheduleStoryDraftSave();
      });
      observer.observe(story, {
        childList: true,
        attributes: true,
        characterData: true,
        subtree: true
      });
    }
    // 保存用データベースを開く
    function initializeStoryDraft() {
      if (!window.indexedDB) {
        console.warn("このブラウザでは自動保存を利用できません");
        return;
      }
      const request = indexedDB.open(
        "StoryPaletteDraftDB",
        1
      );
      request.onupgradeneeded = function (event) {
        const db = event.target.result;
        if (!db.objectStoreNames.contains("drafts")) {
          db.createObjectStore("drafts");
        }
      };
      request.onsuccess = function (event) {
        storyDraftDB = event.target.result;
        const transaction = storyDraftDB.transaction(
          "drafts",
          "readonly"
        );
        const readRequest = transaction
          .objectStore("drafts")
          .get("latest");
        readRequest.onsuccess = function () {
          const savedState = readRequest.result;
          if (savedState) {
            const restore = confirm(
              "前回の編集データがあります。復元しますか？"
            );
            if (restore) {
              try {
                restoreEditorState(savedState);
                updateHistoryButtons();
              } catch (error) {
                console.error("復元エラー:", error);
              }
            } else {
              // 復元しない場合は新しい編集状態で上書き
              saveStoryDraft();
            }
          }
          startStoryDraftWatching();
        };
        readRequest.onerror = function () {
          startStoryDraftWatching();
        };
      };
      request.onerror = function () {
        console.error("自動保存データベースを開けませんでした");
      };
    }
    // 自動保存を開始
    initializeStoryDraft();
    /* 新しいストーリーを作成 */
    function newStory() {
      const confirmed = confirm(
        "現在の写真・文字・背景をすべて消して、" +
        "新しいストーリーを作成しますか？\n\n" +
        "この操作は元に戻せません。"
      );
      // キャンセルした場合は何もしない
      if (!confirmed) return;
      // 自動保存の準備ができているか確認
      if (!storyDraftDB) {
        alert(
          "自動保存の準備ができていません。" +
          "少し待ってからもう一度試してください。"
        );
        return;
      }
      // 保存予約を取り消す
      clearTimeout(storyDraftTimer);
      // 前回の編集データを削除
      const transaction = storyDraftDB.transaction(
        "drafts",
        "readwrite"
      );
      transaction.objectStore("drafts").delete("latest");
      // 削除が完了したらページを初期状態に戻す
      transaction.oncomplete = function () {
        window.location.reload();
      };
      transaction.onerror = function () {
        alert(
          "編集データの削除に失敗しました。" +
          "もう一度試してください。"
        );
      };
    }
    /* 写真・文字の選択を解除する */
    function deselectAllItems() {
      // 写真の選択を解除
      document.querySelectorAll(".storyPhotoItem").forEach(function (img) {
        img.classList.remove("selected");
      });
      // 文字の選択を解除
      document.querySelectorAll(".storyTextItem").forEach(function (el) {
        el.classList.remove("selected");
      });
      selectedPhoto = null;
      selectedText = null;
      // 文字入力欄を空にする
      document.getElementById("storyText").value = "";
      // 一覧の選択表示を更新
      refreshPhotoList();
      refreshTextList();
    }
    // ストーリーの何もない部分をタップしたとき
    storyArea.addEventListener("pointerdown", function (e) {
      // 写真や文字をタップした場合は解除しない
      if (e.target !== storyArea) return;
      deselectAllItems();
    });
    /* 選択した写真または文字を削除 */
    function deleteSelectedItem() {
      // 写真が選択されている場合
      if (selectedPhoto) {
        removePhoto();
        return;
      }
      // 文字が選択されている場合
      if (selectedText) {
        removeText();
        return;
      }
      // 何も選択されていない場合
      alert("削除する写真か文字を選択してください");
    }
    /* 選択状態に合わせて削除ボタンを更新 */
    function updateDeleteButton() {
      const button = document.getElementById("deleteSelectedButton");
      const photoSelected =
        selectedPhoto &&
        selectedPhoto.isConnected &&
        selectedPhoto.classList.contains("selected");
      const textSelected =
        selectedText &&
        selectedText.isConnected &&
        selectedText.classList.contains("selected");
      if (photoSelected) {
        button.textContent = "🗑️ 写真を削除";
        button.disabled = false;
      } else if (textSelected) {
        button.textContent = "🗑️ 文字を削除";
        button.disabled = false;
      } else {
        button.textContent = "🗑️ 写真か文字を選択してね";
        button.disabled = true;
      }
    }
    /* 写真や文字の選択・削除を監視 */
    const deleteButtonObserver = new MutationObserver(function () {
      updateDeleteButton();
    });
    deleteButtonObserver.observe(storyArea, {
      childList: true,
      attributes: true,
      attributeFilter: ["class"],
      subtree: true
    });
    // 最初の表示を設定
    updateDeleteButton();
    /* 写真・文字をタップしたら編集タブを切り替える */
    storyArea.addEventListener("pointerdown", function (e) {
      const tappedPhoto = e.target.closest(".storyPhotoItem");
      const tappedText = e.target.closest(".storyTextItem");
      const tabButtons = document.querySelectorAll(".tabButton");
      // 写真をタップした場合
      if (tappedPhoto) {
        showTab("photo", tabButtons[0]);
      }
      // 文字をタップした場合
      else if (tappedText) {
        showTab("text", tabButtons[1]);
      }
    });
    /* 中央ガイドラインの作成 */
    const verticalGuide = document.createElement("div");
    verticalGuide.className = "centerGuide vertical";
    const horizontalGuide = document.createElement("div");
    horizontalGuide.className = "centerGuide horizontal";
    storyArea.appendChild(verticalGuide);
    storyArea.appendChild(horizontalGuide);
    /* ガイドラインを非表示にする */
    function hideCenterGuides() {
      verticalGuide.style.display = "none";
      horizontalGuide.style.display = "none";
    }
    /* 写真や文字の中心位置を確認 */
    function updateCenterGuides(item) {
      const storyRect = storyArea.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const centerX = storyRect.left + storyRect.width / 2;
      const centerY = storyRect.top + storyRect.height / 2;
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      // 中央から8px以内ならガイド線を表示
      const nearCenterX = Math.abs(itemCenterX - centerX) < 8;
      const nearCenterY = Math.abs(itemCenterY - centerY) < 8;
      verticalGuide.style.display =
        nearCenterX ? "block" : "none";
      horizontalGuide.style.display =
        nearCenterY ? "block" : "none";
    }
    /* ドラッグ中に中央位置をチェック */
    storyArea.addEventListener("pointermove", function (e) {
      const item = e.target.closest(
        ".storyPhotoItem, .storyTextItem"
      );
      if (!item) return;
      // マウスを乗せただけでは表示しない
      if (e.pointerType === "mouse" && e.buttons === 0) {
        return;
      }
      updateCenterGuides(item);
    });
    /* 指を離したらガイド線を消す */
    storyArea.addEventListener("pointerup", hideCenterGuides);
    storyArea.addEventListener("pointercancel", hideCenterGuides);
    storyArea.addEventListener("pointerleave", hideCenterGuides);
    /* 写真・文字を中央にスナップさせる */
    function snapItemToCenter(item) {
      const storyRect = storyArea.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const centerX = storyRect.left + storyRect.width / 2;
      const centerY = storyRect.top + storyRect.height / 2;
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      const differenceX = centerX - itemCenterX;
      const differenceY = centerY - itemCenterY;
      // 中央から8px以内なら吸い付く
      const snapDistance = 8;
      // 画面上の距離を編集エリア内の座標に変換
      const scaleX = storyRect.width / storyArea.offsetWidth;
      const scaleY = storyRect.height / storyArea.offsetHeight;
      let changed = false;
      if (Math.abs(differenceX) <= snapDistance) {
        item.dataset.x = String(
          Number(item.dataset.x || 0) + differenceX / scaleX
        );
        changed = true;
      }
      if (Math.abs(differenceY) <= snapDistance) {
        item.dataset.y = String(
          Number(item.dataset.y || 0) + differenceY / scaleY
        );
        changed = true;
      }
      // 中央に吸い付いた位置を画面に反映
      if (changed) {
        if (item.classList.contains("storyPhotoItem")) {
          updatePhotoItem(item);
        } else if (item.classList.contains("storyTextItem")) {
          updateTextTransform(item);
        }
      }
    }
    /* 選択した写真・文字を整列する */
    function alignSelectedItem(position) {
      const item =
        document.querySelector(".storyPhotoItem.selected") ||
        document.querySelector(".storyTextItem.selected");
      if (!item) {
        alert("先に写真か文字を選択してください");
        return;
      }
      // ロック中は整列できない
      if (isItemLocked(item)) {
        alert("ロックを解除してから位置を変更してください");
        return;
      }
      const storyRect = storyArea.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      // 編集画面の倍率を取得
      const scaleX = storyRect.width / storyArea.offsetWidth;
      const scaleY = storyRect.height / storyArea.offsetHeight;
      // 画面端から10pxの余白
      const marginX = 10 * scaleX;
      const marginY = 10 * scaleY;
      let dx = 0;
      let dy = 0;
      // 左右の整列
      if (position === "left") {
        dx = storyRect.left + marginX - itemRect.left;
      } else if (position === "centerX") {
        dx = (storyRect.left + storyRect.width / 2) -
          (itemRect.left + itemRect.width / 2);
      } else if (position === "right") {
        dx = storyRect.right - marginX - itemRect.right;
      }
      // 上下の整列
      else if (position === "top") {
        dy = storyRect.top + marginY - itemRect.top;
      } else if (position === "centerY") {
        dy = (storyRect.top + storyRect.height / 2) -
          (itemRect.top + itemRect.height / 2);
      } else if (position === "bottom") {
        dy = storyRect.bottom - marginY - itemRect.bottom;
      }
      // すでに揃っていれば何もしない
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
        return;
      }
      // 移動前の状態を履歴に保存
      saveHistory();
      item.dataset.x = String(
        Number(item.dataset.x || 0) + dx / scaleX
      );
      item.dataset.y = String(
        Number(item.dataset.y || 0) + dy / scaleY
      );
      // 変更後の位置を画面に反映
      if (item.classList.contains("storyPhotoItem")) {
        updatePhotoItem(item);
      } else {
        updateTextTransform(item);
      }
    }
    /* 選択した写真・文字のロック切り替え */
    /* ロックされているか確認 */
    function isItemLocked(item) {
      return item && item.dataset.locked === "true";
    }
    function toggleItemLock() {
      const item =
        document.querySelector(".storyPhotoItem.selected") ||
        document.querySelector(".storyTextItem.selected");
      if (!item) {
        alert("写真か文字を選択してください");
        return;
      }
      // ロック変更前の状態を保存
      saveHistory();
      const isLocked = item.dataset.locked === "true";
      item.dataset.locked = isLocked ? "false" : "true";
      refreshPhotoList();
      refreshTextList();
      if (isLocked) {
        alert("ロックを解除しました");
      } else {
        alert("位置をロックしました");
      }
    }
    /* ロック状態に合わせて編集スライダーを切り替える */
    function updateLockControls() {
      const photo = document.querySelector(
        ".storyPhotoItem.selected"
      );
      const text = document.querySelector(
        ".storyTextItem.selected"
      );
      // 写真サイズのスライダー
      const photoSize = document.getElementById("photoSize");
      photoSize.disabled =
        !photo || photo.dataset.locked === "true";
      // 文字サイズ・回転のスライダー
      const textSize = document.getElementById("textSize");
      const textRotation = document.getElementById("textRotation");
      const textLocked =
        !text || text.dataset.locked === "true";
      textSize.disabled = textLocked;
      textRotation.disabled = textLocked;
    }
    /* 選択状態やロック状態の変化を監視 */
    const lockControlsObserver = new MutationObserver(function () {
      updateLockControls();
    });
    lockControlsObserver.observe(storyArea, {
      childList: true,
      attributes: true,
      attributeFilter: ["class", "data-locked"],
      subtree: true
    });
    // 最初の状態を反映
    updateLockControls();

    /* 詳細ツールの表示・非表示 */
    function toggleAdvancedTools() {
      const editor = document.getElementById("editorArea");
      const button = document.getElementById("toolToggleButton");

      const isCollapsed =
        editor.classList.toggle("toolsCollapsed");

      button.textContent = isCollapsed
        ? "⚙️ 詳細ツールを表示 ▼"
        : "⚙️ 詳細ツールを閉じる ▲";

      button.setAttribute(
        "aria-expanded",
        String(!isCollapsed)
      );
    }

    // ページを開いたときは折りたたんだ状態にする
    document.getElementById("editorArea")
      .classList.add("toolsCollapsed");

  </script>
