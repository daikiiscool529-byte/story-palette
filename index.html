<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StoryPalette</title>
  <style>
    @font-face {
      font-family: "Nico Moji Plus";
      src: url("https://aws2000.net/font/nicomoji/nicomoji-plus_v0.9.woff") format("woff");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    body {
      font-family: "Nico Moji Plus", sans-serif;
      background: #f8edf2;
      text-align: center;
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }

    * {
      box-sizing: border-box;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .story {
      width: 270px;
      height: 480px;
      background: #e9dfce;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    .story img {
      position: absolute;
      left: 50%;
      top: 50%;
      max-width: none;
      max-height: none;
      object-fit: contain;
      touch-action: none;
      cursor: grab;
      user-select: none;
    }

    .storyTextItem {
      touch-action: none;
      position: absolute;
      left: 50%;
      top: 400px;
      width: max-content;
      max-width: 240px;
      margin: 0;
      padding: 0;
      color: #555555;
      font-size: 15px;
      font-family: "Nico Moji Plus", sans-serif;
      line-height: 1.2;
      text-align: center;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      touch-action: none;
      cursor: grab;
      user-select: none;
      transform: translateX(-50%);
    }

    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }

    input {
      margin: 10px;
    }

    /* 編集タブ */
    .editTabs {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 20px auto 10px;
      max-width: 360px;
    }

    .tabButton {
      flex: 1;
      padding: 12px 5px;
      border: none;
      border-radius: 12px 12px 0 0;
      background: #eadde5;
      color: #665260;
      font-size: 14px;
    }

    .tabButton.active {
      background: white;
      color: #a65d87;
      font-weight: bold;
    }

    .tabContent {
      display: none;
      background: white;
      padding: 16px 10px;
      border-radius: 12px;
      max-width: 340px;
      margin: 0 auto;
    }

    .tabContent.active {
      display: block;
    }

    .tabContent textarea {
      width: 85%;
      max-width: 280px;
      padding: 8px;
      box-sizing: border-box;
    }

    .saveButton {
      background: #a87898;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 15px;
    }

    /* スマホ向けデザイン */
    .editTabs {
      width: 100%;
      max-width: 360px;
      gap: 6px;
      padding: 0 4px;
    }

    .tabButton {
      min-height: 48px;
      margin: 0;
      padding: 12px 4px;
      font-size: 14px;
      border-radius: 12px 12px 0 0;
    }

    .tabContent {
      width: 100%;
      max-width: 360px;
      padding: 20px 12px;
      border-radius: 0 0 14px 14px;
    }

    .tabContent p {
      font-size: 14px;
      font-weight: 500;
      color: #665260;
    }

    .tabContent input[type="range"] {
      width: 85%;
      max-width: 280px;
      accent-color: #a87898;
    }

    .tabContent input[type="file"] {
      max-width: 100%;
      font-size: 13px;
    }

    .tabContent select,
    .tabContent textarea {
      max-width: 100%;
      font-size: 16px;
      border: 1px solid #e5d6df;
      border-radius: 8px;
      padding: 10px;
    }

    .tabContent button {
      min-height: 44px;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      background: #f0e4eb;
      color: #665260;
    }

    .saveButton {
      display: block;
      width: 100%;
      max-width: 360px;
      min-height: 50px;
      margin: 20px auto;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      background: #a87898;
      color: white;
    }

    /* 小さいスマホ向け */
    @media (max-width: 360px) {
      body {
        padding: 10px;
      }

      .tabButton {
        font-size: 12px;
      }
    }

    /* 文字の縁取り */
    .storyTextItem {
      -webkit-text-stroke: 0px;
      paint-order: stroke fill;
    }

    /* 文字の影 */
    .story.shadow {
      text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.6);
    }

    /* 選択中の文字 */
    .storyTextItem.selected {
      outline: 1px dashed rgba(0, 0, 0, 0.5);
      outline-offset: 3px;
    }

    /* 文字一覧 */
    #textList button {
      margin: 4px;
      padding: 8px 12px;
    }

    #textList button.active {
      background: #a87898;
      color: white;
    }

    .storyPhotoItem.selected {
      outline: 2px dashed #a87898;
      outline-offset: 3px;
    }

    #photoList button {
      margin: 4px;
      padding: 8px 12px;
    }

    #photoList button.active {
      background: #a87898;
      color: white;
    }

    .addPhotoButton {
      display: inline-block;
      background: #a87898;
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 12px auto;
    }

    /* 元に戻す・やり直すボタン */
    .historyControls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 15px auto;
    }

    .historyControls button {
      background: #a87898;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
    }

    .historyControls button:disabled {
      background: #ddd;
      color: #999;
      cursor: not-allowed;
    }

    /* 新規作成ボタン */
    .newStoryControls {
      text-align: center;
      margin: 12px auto;
    }

    .newStoryControls button {
      background: #f0e4eb;
      color: #8c526f;
      border: 1px solid #d8b9ca;
      border-radius: 10px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 共通削除ボタン */
    .deleteControls {
      display: flex;
      justify-content: center;
      margin: 12px auto;
    }

    .deleteControls button {
      background: #fff0f3;
      color: #c04f68;
      border: 1px solid #efb9c5;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 選択されていないときの削除ボタン */
    .deleteControls button:disabled {
      background: #eeeeee;
      color: #999999;
      border-color: #dddddd;
      cursor: not-allowed;
    }

    /* 中央配置のガイドライン */
    .centerGuide {
      position: absolute;
      display: none;
      background: #e05b97;
      z-index: 9999;
      pointer-events: none;
    }

    .centerGuide.vertical {
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
    }

    .centerGuide.horizontal {
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
    }

    /* 写真・文字の整列ボタン */
    .alignControls {
      max-width: 360px;
      margin: 15px auto;
      padding: 12px;
      background: white;
      border-radius: 12px;
    }

    .alignControls p {
      color: #665260;
      font-size: 14px;
      font-weight: bold;
    }

    .alignControls button {
      background: #f0e4eb;
      color: #665260;
      border: none;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
    }

    /* ロックボタン */
    .lockControls {
      margin: 12px auto;
      text-align: center;
    }

    .lockControls button {
      background: #f0e4eb;
      color: #665260;
      border: 1px solid #d8b9ca;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      font-weight: bold;
    }

    /* ロック中の選択表示 */
    .storyPhotoItem.selected[data-locked="true"],
    .storyTextItem.selected[data-locked="true"] {
      outline: 2px solid #8c526f;
    }

    /* ロック中のスライダー */
    #photoSize:disabled,
    #textSize:disabled,
    #textRotation:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      filter: grayscale(100%);
    }

    /* ロックした項目を選択中は鍵マークを表示 */
    /* 写真・文字の右上に表示する操作ボタン */
    .itemCornerActions {
      position: absolute;
      z-index: 20000;
      display: none;
      width: 34px;
      height: 16px;
      gap: 2px;
      align-items: center;
      justify-content: flex-end;
      pointer-events: auto;
    }

    /* 小さな鍵・削除ボタン */
    .itemCornerActions button {
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #665260;
      font-size: 6px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      touch-action: manipulation;
    }

    .itemCornerActions .cornerDelete {
      background: #333333;
      color: white;
      font-size: 10px;
    }

    /* 写真上の装飾アイテム用の右下操作ポップアップ */
    .itemCornerActions.stickerActions {
      left: auto !important;
      top: auto !important;
      right: 6px;
      bottom: 6px;
      width: auto;
      height: auto;
      gap: 3px;
      padding: 2px 4px;
      border: 1px solid rgba(220, 197, 212, 0.9);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 2px 9px rgba(75, 48, 65, 0.18);
      backdrop-filter: blur(8px);
    }

    .itemCornerActions.stickerActions button {
      width: auto;
      min-width: 42px;
      height: 19px;
      padding: 0 5px;
      border-radius: 5px;
      font-size: 8px;
      font-weight: 700;
      white-space: nowrap;
    }

    .itemCornerActions.stickerActions .cornerFont {
      background: #eee5ed;
      color: #725c70;
      opacity: 0.55;
      cursor: default;
    }

    .itemCornerActions.stickerActions .cornerLock {
      background: #f6eaf1;
      color: #80566d;
      opacity: 1;
      filter: none;
    }

    .itemCornerActions.stickerActions .cornerLock.isLocked {
      background: #80566d;
      color: #fff;
    }

    .itemCornerActions.stickerActions .cornerDelete {
      background: #d96b9f;
      color: #fff;
      font-size: 8px;
    }

    /* 詳細ツールの開閉ボタン */
    .toolToggleControls {
      max-width: 360px;
      margin: 12px auto;
      text-align: center;
    }

    .toolToggleControls button {
      width: 100%;
      background: #f0e4eb;
      color: #665260;
      border: 1px solid #d8b9ca;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 最初は詳細ツールを折りたたむ */
    #editorArea.toolsCollapsed .alignControls,
    #editorArea.toolsCollapsed .lockControls {
      display: none;
    }

    /* 写真・文字一覧の折りたたみ */
    .editorAccordion {
      background: #f8f0f5;
      border: 1px solid #ead8e3;
      border-radius: 10px;
      margin: 12px auto;
      padding: 0;
      overflow: hidden;
    }

    .editorAccordion summary {
      padding: 14px;
      color: #665260;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      text-align: left;
    }

    .editorAccordion[open] summary {
      border-bottom: 1px solid #ead8e3;
    }

    .editorAccordion #photoList,
    .editorAccordion #textList {
      padding: 10px;
    }

    /* 文字の装飾設定 */
    .textDecorationAccordion {
      margin-top: 18px;
    }

    .decorationSettings {
      padding: 14px;
      text-align: left;
    }

    .decorationSettings>label {
      display: block;
      margin: 12px 0;
      color: #665260;
      font-size: 14px;
    }

    .decorationSettings>div {
      margin: 14px 0;
    }

    .decorationSettings>div label {
      display: block;
      margin-bottom: 6px;
      color: #665260;
      font-size: 13px;
    }
    #textTab #customTextEntry .textDecorationHeading { margin: 4px 0 2px; font-size: 10px; line-height: 1.1; }
    #textTab #customTextEntry .textDecorationAccordion { margin: 2px 0 5px; border-radius: 8px; }
    #textTab #customTextEntry .textDecorationAccordion summary { padding: 6px 8px; font-size: 10px; line-height: 1.15; }
    #textTab #customTextEntry .decorationSettings { padding: 6px 8px; font-size: 9px; }
    #textTab #customTextEntry .decorationSettings>label { margin: 3px 0; font-size: 9px; line-height: 1.2; }
    #textTab #customTextEntry .decorationSettings>div { display: grid; grid-template-columns: 74px minmax(0,1fr); align-items: center; gap: 4px; margin: 4px 0; }
    #textTab #customTextEntry .decorationSettings>div label { margin: 0; font-size: 8px; line-height: 1.1; }
    #textTab #customTextEntry .decorationSettings input[type="color"] { width: 20px; height: 20px; margin: 0; padding: 2px; }
    #textTab #customTextEntry .decorationSettings input[type="range"] { width: 100%; height: 13px; margin: 0 !important; padding: 0; }

    /* 選択中の写真・文字を見やすくする */
    .storyPhotoItem.selected,
    .storyTextItem.selected {
      outline: 2px dashed #a87898;
      outline-offset: 3px;
    }

    /* ロック中は実線に変更 */
    .storyPhotoItem.selected[data-locked="true"],
    .storyTextItem.selected[data-locked="true"] {
      outline: 2px solid #8c526f;
      outline-offset: 3px;
    }

    /* 右上の操作ボタンを少しコンパクトに */
    .itemCornerActions {
      gap: 2px;
    }

    .itemCornerActions button {
      width: 16px;
      height: 16px;
      font-size: 6px;
      opacity: 0.95;
    }

    .itemCornerActions .cornerLock { font-size: 6px; }
    .itemCornerActions .cornerDelete {
      font-size: 10px;
    }

    /* 押したときの反応 */
    .itemCornerActions button:active {
      transform: scale(0.92);
    }

    /* ロック解除中：薄い鍵 */
    .itemCornerActions .cornerLock {
      background: #ffffff;
      opacity: 0.35;
      filter: grayscale(100%);
      transition: opacity 0.15s, background 0.15s;
    }

    /* ロック中：濃い鍵 */
    .itemCornerActions .cornerLock.isLocked {
      background: #665260;
      opacity: 1;
      filter: grayscale(100%);
    }

    /* 操作ボタンを写真・文字の動きにすぐ追従させる */
    .itemCornerActions {
      transition: none;
      will-change: left, top;
    }

    /* iPhoneでのタップ操作を安定させる */
    .itemCornerActions button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* 上下左右の吸着ガイドライン */
    .edgeGuide {
      position: absolute;
      display: none;
      background: #e05b97;
      z-index: 9999;
      pointer-events: none;
    }

    /* 左右のガイド */
    .edgeGuide.left,
    .edgeGuide.right {
      top: 0;
      width: 1px;
      height: 100%;
    }

    .edgeGuide.left {
      left: 10px;
    }

    .edgeGuide.right {
      right: 10px;
    }

    /* 上下のガイド */
    .edgeGuide.top,
    .edgeGuide.bottom {
      left: 0;
      width: 100%;
      height: 1px;
    }

    .edgeGuide.top {
      top: 10px;
    }

    .edgeGuide.bottom {
      bottom: 10px;
    }

    /* プレビューボタン */
    .previewButton {
      background: #a87898;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 22px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    /* プレビュー中は選択枠を隠す */
    .story.previewMode .storyPhotoItem.selected,
    .story.previewMode .storyTextItem.selected {
      outline: none !important;
    }

    /* 鍵・削除ボタンとガイドラインを隠す */
    .story.previewMode .itemCornerActions,
    .story.previewMode .centerGuide,
    .story.previewMode .edgeGuide {
      display: none !important;
    }

    /* プレビュー中は写真・文字を操作できない */
    .story.previewMode .storyPhotoItem,
    .story.previewMode .storyTextItem {
      pointer-events: none;
    }

    /* 背景グラデーションの選択ボタン */
    .gradientButtons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 12px 0 22px;
    }

    .gradientButtons button {
      margin: 0;
      padding: 14px 5px;
      min-height: 65px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .gradientButtons .gradientHeisei {
      background: linear-gradient(135deg, #ff9fcf, #ffe7f4, #c9b2ff, #a6e8ff);
      color: #743a68;
    }

    .gradientButtons .gradientKorean {
      background: linear-gradient(160deg, #fff8ee, #fce9ee, #e6e2fa, #d8e9e7);
      color: #756776;
    }

    .gradientButtons .gradientY2K {
      background: linear-gradient(145deg, #e5faff, #adc5e9, #d3bafb,
          #8c95c7, #445a93);
      color: #243b70;
    }

    /* 平成プリ風のデコレーション */
    .story[data-decor-preset="heisei"]::before,
    .story[data-decor-preset="heisei"]::after {
      position: absolute;
      z-index: 9000;
      pointer-events: none;
      color: #ff73b6;
      font-weight: bold;
      font-family: sans-serif;
      font-size: 20px;
      text-shadow:
        1px 1px 0 #ffffff,
        -1px -1px 0 #ffffff,
        0 0 7px #ffffff;
    }

    /* 左上のキラキラ */
    .story[data-decor-preset="heisei"]::before {
      content: "✦ ♡ ✦";
      top: 16px;
      left: 12px;
      transform: rotate(-12deg);
    }

    /* 右下のハート */
    .story[data-decor-preset="heisei"]::after {
      content: "♡ ✧ ♡";
      bottom: 18px;
      right: 12px;
      transform: rotate(8deg);
    }

    /* 韓国コラージュ：白い写真フレーム */
    .story[data-decor-preset="korean"] .storyPhotoItem {
      box-shadow: 0 0 0 calc(5px * var(--decor-scale, 1)) rgba(255,250,245,var(--decor-opacity, 1));
    }

    /* 韓国コラージュ：マスキングテープ共通 */
    .story[data-decor-preset="korean"]::before,
    .story[data-decor-preset="korean"]::after {
      content: "";
      position: absolute;
      width: 78px;
      height: 20px;
      background:
        repeating-linear-gradient(45deg,
          rgba(255, 255, 255, 0.22) 0 5px,
          transparent 5px 12px),
        rgba(238, 210, 189, 0.82);
      z-index: 9000;
      pointer-events: none;
    }

    /* 左上のテープ */
    .story[data-decor-preset="korean"]::before {
      top: 26px;
      left: 12px;
      transform: rotate(-13deg);
    }

    /* 右下のテープ */
    .story[data-decor-preset="korean"]::after {
      bottom: 28px;
      right: 12px;
      transform: rotate(10deg);
    }

    /* Y2Kカメラ：REC表示とファインダー枠 */
    .story[data-decor-preset="y2k"]::before {
      content: "● REC";
      position: absolute;
      inset: 10px;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.85);
      color: #ffffff;
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      text-shadow: 1px 1px 3px #000000;
      z-index: 9000;
      pointer-events: none;
    }

    /* Y2Kカメラ：日時表示 */
    .story[data-decor-preset="y2k"]::after {
      content: attr(data-y2k-timestamp);
      position: absolute;
      bottom: 22px;
      right: 20px;
      color: #ffffff;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 3px #000000;
      z-index: 9000;
      pointer-events: none;
    }

    /* 追加の装飾プリセット */
    .story[data-decor-preset="scrapbook"]::before,
    .story[data-decor-preset="scrapbook"]::after,
    .story[data-decor-preset="softSparkle"]::before,
    .story[data-decor-preset="softSparkle"]::after,
    .story[data-decor-preset="polaroid"]::before,
    .story[data-decor-preset="polaroid"]::after {
      position: absolute; z-index: 9000; pointer-events: none;
    }
    .story[data-decor-preset="scrapbook"]::before { content: "✂  ─ ─ ─"; top: 18px; left: 14px; color: #9a715c; font-size: 14px; transform: rotate(-8deg); }
    .story[data-decor-preset="scrapbook"]::after { content: "MEMORIES  •  TODAY"; right: 12px; bottom: 20px; padding: 5px 7px; border: 1px solid #b89b7d; background: rgba(255,250,238,.82); color: #806b56; font: 9px monospace; transform: rotate(4deg); }

  <!-- 完成画像の表示画面 -->
  <div id="saveArea" style="display:none; margin:20px auto;">

  <script>
    const photo = document.getElementById("photo");
    let selectedPhoto = null;
    let photoCounter = 0;
    const photoList = document.getElementById("photoList");
    photo.classList.add("photoUpload");
    photo.addEventListener("change", function () {
      const file = photo.files[0];
      const slotId = photo.dataset.collageTarget || "";
      delete photo.dataset.collageTarget;
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        alert("画像ファイルを選択してください");
        return;
      }
      const reader = new FileReader();
      reader.onload = function (event) {
        const img = document.createElement("img");
        img.className = "storyPhotoItem";
        img.alt = "追加した写真";
        img.draggable = false;
        img.style.display = "block";
        img.dataset.x = "0";
        img.dataset.y = "0";
        img.dataset.size = "100";
        img.dataset.name = "写真 " + (++photoCounter);
        img.onload = function () {
          updatePhotoItem(img);
        };
        img.src = event.target.result;
        if (slotId) {
          const slotFrame = storyArea.querySelector(`.collageSlot[data-slot-id="${slotId}"]`);
          const slotMask = slotFrame && slotFrame.querySelector(".collagePhotoMask");
          if (!slotMask) return;
          saveHistory();
          const previous = slotMask.querySelector(".storyPhotoItem");
          if (previous) previous.remove();
          img.dataset.collageSlot = slotId;
          img.dataset.size = "100";
          img.dataset.rotation = "0";
          slotMask.appendChild(img);
          enablePhotoDrag(img);
          updateCollagePhoto(img);
          selectPhoto(img);
          setPhotoLayer(photoLayer);
          return;
        }
        // 写真を追加する前の状態を保存
        saveHistory();
        storyArea.appendChild(img);
        enablePhotoDrag(img);
        selectPhoto(img);
        setPhotoLayer(photoLayer);
      };
      reader.onerror = function () {
        alert("写真の読み込みに失敗しました");
      };
      reader.readAsDataURL(file);
      // 同じ写真を続けて追加できるようにする
      photo.value = "";
    });
    const regularPhotoButton = document.querySelector(".addPhotoButton");
    if (regularPhotoButton) {
      regularPhotoButton.addEventListener("click", function () {
        delete photo.dataset.collageTarget;
      });
    }
    function clearDecorPresetSelection() {
      selectedDecorPreset = false;
      const story = document.querySelector(".story");
      if (story) story.classList.remove("decorPresetSelected", "decorMoveMode");
      updateDecorMoveModeButton();
    }
    function selectPhoto(img) {
      clearDecorPresetSelection();
      document.querySelectorAll(".storyPhotoItem").forEach(function (item) {
        item.classList.remove("selected");
      });
      selectedPhoto = img;
      // 文字の選択を解除する
      document.querySelectorAll(".storyTextItem").forEach(function (el) {
        el.classList.remove("selected");
      });
      selectedText = null;
      refreshTextList();
      refreshStickerList();
      if (img) {
        img.classList.add("selected");
        document.getElementById("photoSize").value =
          img.dataset.size || "100";
      }
      refreshPhotoList();
      updatePhotoFilterButtons();
      updatePhotoFilterStrengthUI();
    }
    function refreshPhotoList() {
      photoList.innerHTML = "";
      document.querySelectorAll(".storyPhotoItem").forEach(function (img, index) {
        const button = document.createElement("button");
        button.type = "button";
        const lockIcon =
          img.dataset.locked === "true" ? "🔒 " : "";
        button.textContent =
          lockIcon +
          (index + 1) + "： " +
          (img.dataset.name || "写真 " + (index + 1));
        if (img === selectedPhoto) {
          button.classList.add("active");
        }
        button.addEventListener("click", function () {
          selectPhoto(img);
        });
        photoList.appendChild(button);
      });
    } function updatePhotoItem(img) {
      if (!img.naturalWidth) return;
      if (img.dataset.collageSlot) {
        updateCollagePhoto(img);
        updateItemCornerActions();
        return;
      }
      const size = Number(img.dataset.size || 100) / 100;
      const rotation = Number(img.dataset.rotation || 0);
      const scale = Math.min(
        220 / img.naturalWidth,
        320 / img.naturalHeight
      ) * size;
      img.style.width = (img.naturalWidth * scale) + "px";
      img.style.height = (img.naturalHeight * scale) + "px";
      const x = Number(img.dataset.x || 0);
      const y = Number(img.dataset.y || 0);
      img.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) rotate(${rotation}deg)`;
      // 写真の位置変更と同時に操作ボタンも移動
      updateItemCornerActions();
    }
    /* 写真と文字で共通のタッチ操作。種類の取り違えを防止する */
    function enableItemDrag(item, kind) {
      const pointers = new Map();
      const isPhoto = kind === "photo";
      let gestureHistorySaved = false;
      let dragPointerX = 0;
      let dragPointerY = 0;
      let dragItemX = 0;
      let dragItemY = 0;
      let startDistance = 0;
      let startAngle = 0;
      let startSize = 100;
      let startRotation = 0;
      let startMidX = 0;
      let startMidY = 0;
      let startCenterX = 0;
      let startCenterY = 0;
      function getDistance(a, b) {
        return Math.hypot(b.x - a.x, b.y - a.y);
      }
      function getAngle(a, b) {
        return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      }
      function getScale() {
        const rect = storyArea.getBoundingClientRect();
        return {
          rect: rect,
          x: rect.width / storyArea.offsetWidth,
          y: rect.height / storyArea.offsetHeight
        };
      }
      function refreshItem() {
        if (isPhoto) {
          updatePhotoItem(item);
        } else {
          updateTextTransform(item);
        }
      }
      function beginSinglePointer(point) {
        dragPointerX = point.x;
        dragPointerY = point.y;
        dragItemX = Number(item.dataset.x || 0);
        dragItemY = Number(item.dataset.y || 0);
      }
      function beginPinch() {
        const [a, b] = [...pointers.values()];
        startDistance = getDistance(a, b);
        startAngle = getAngle(a, b);
        startSize = isPhoto
          ? Number(item.dataset.size || 100)
          : parseFloat(getComputedStyle(item).fontSize);
        startRotation = Number(item.dataset.rotation || 0);
        startMidX = (a.x + b.x) / 2;
        startMidY = (a.y + b.y) / 2;
        const rect = item.getBoundingClientRect();
        startCenterX = rect.left + rect.width / 2;
        startCenterY = rect.top + rect.height / 2;
        // ピンチ中は吸着を使わない（つまんだ点がずれるのを防ぐ）
        hideAllSnapGuides();
      }
      item.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        if (isPhoto) selectPhoto(item);
        else selectText(item);
        if (item.dataset.locked === "true") return;
        if (pointers.has(e.pointerId) || pointers.size >= 2) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        item.setPointerCapture(e.pointerId);
        if (pointers.size === 1) {
          beginSinglePointer({ x: e.clientX, y: e.clientY });
        } else if (pointers.size === 2) {
          beginPinch();
        }
      });
      item.addEventListener("pointermove", function (e) {
        const previous = pointers.get(e.pointerId);
        if (!previous) return;
        if (previous.x === e.clientX && previous.y === e.clientY) return;
        if (!gestureHistorySaved) {
          saveHistory();
          gestureHistorySaved = true;
        }
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const storyScale = getScale();
        if (pointers.size === 1) {
          // 指が動いた距離を編集画面の倍率で割る
          item.dataset.x = String(
            dragItemX + (e.clientX - dragPointerX) / storyScale.x
          );
          item.dataset.y = String(
            dragItemY + (e.clientY - dragPointerY) / storyScale.y
          );
          refreshItem();
          snapItemToGuides(item);
          updateCenterGuides(item);
          updateEdgeGuides(item);
          return;
        }
        if (pointers.size === 2 && startDistance > 0) {
          const [a, b] = [...pointers.values()];
          const distanceRatio = getDistance(a, b) / startDistance;
          const angle =
            ((getAngle(a, b) - startAngle + 540) % 360) - 180;
          const newSize = isPhoto
            ? Math.max(10, Math.min(400, startSize * distanceRatio))
            : Math.max(8, Math.min(100, startSize * distanceRatio));
          const newRotation = startRotation + angle;
          const zoom = newSize / startSize;
          const rad = angle * Math.PI / 180;
          if (isPhoto) {
            item.dataset.size = String(newSize);
            document.getElementById("photoSize").value = String(newSize);
          } else {
            item.style.fontSize = newSize + "px";
            document.getElementById("textSize").value = String(newSize);
            document.getElementById("textRotation").value = String(
              Math.max(-180, Math.min(180, newRotation))
            );
            document.getElementById("rotationValue").textContent =
              Math.round(newRotation) + "°";
          }
          item.dataset.rotation = String(newRotation);
          // つまんだ位置を中心として、写真・文字の中心点を変換する
          const midX = (a.x + b.x) / 2;
          const midY = (a.y + b.y) / 2;
          const offsetX = startCenterX - startMidX;
          const offsetY = startCenterY - startMidY;
          const nextCenterX = midX +
            (offsetX * Math.cos(rad) - offsetY * Math.sin(rad)) * zoom;
          const nextCenterY = midY +
            (offsetX * Math.sin(rad) + offsetY * Math.cos(rad)) * zoom;
          item.dataset.x = String(
            (nextCenterX -
              (storyScale.rect.left + storyScale.rect.width / 2)) /
            storyScale.x
          );
          if (isPhoto) {
            item.dataset.y = String(
              (nextCenterY -
                (storyScale.rect.top + storyScale.rect.height / 2)) /
              storyScale.y
            );
          } else {
            // 文字は上端を基準に配置しているため文字の高さを補正
            const textTop = parseFloat(getComputedStyle(item).top) || 0;
            item.dataset.y = String(
              (nextCenterY - storyScale.rect.top) / storyScale.y -
              textTop - item.offsetHeight / 2
            );
          }
          refreshItem();
        }
      });
      function endPointer(e) {
        if (!pointers.has(e.pointerId)) return;
        pointers.delete(e.pointerId);
        if (pointers.size === 1) {
          // 2本指から1本指になった瞬間、現在位置からドラッグを再開
          beginSinglePointer([...pointers.values()][0]);
        } else if (pointers.size === 0) {
          gestureHistorySaved = false;
          startDistance = 0;
          hideAllSnapGuides();
        }
      }
      item.addEventListener("pointerup", endPointer);
      item.addEventListener("pointercancel", endPointer);
      item.addEventListener("lostpointercapture", endPointer);
    }
    function enablePhotoDrag(img) {
      enableItemDrag(img, "photo");
    }
    function duplicatePhoto() {
      if (!selectedPhoto) return;
      // 複製する前の状態を保存
      saveHistory();
      const original = selectedPhoto;
      const copy = original.cloneNode(true);
      copy.classList.remove("selected");
      const x = Number(original.dataset.x || 0);
      const y = Number(original.dataset.y || 0);
      // 右下に30pxずらす
      let nextX = x + 30;
      let nextY = y + 30;
      // 中心位置が端に近づいたら反対側へ
      if (nextX > 90) nextX = -90;

    function movePhotoForward() {

        ...document.querySelectorAll(".storyPhotoItem")
      ];
      const index = photos.indexOf(selectedPhoto);
      if (index < photos.length - 1) {
        saveHistory();
        const moving = selectedPhoto.dataset.collageSlot ? selectedPhoto.closest(".collageSlot") : selectedPhoto;
        const next = photos[index + 1];
        const nextLayer = next.dataset.collageSlot ? next.closest(".collageSlot") : next;
        nextLayer.after(moving);
      }
      refreshPhotoList();
    } function movePhotoBackward() {
      if (!selectedPhoto) {
        alert("写真を選択してください");

        ...document.querySelectorAll(".storyPhotoItem")
      ];
      const index = photos.indexOf(selectedPhoto);
      if (index > 0) {
        saveHistory();
        const moving = selectedPhoto.dataset.collageSlot ? selectedPhoto.closest(".collageSlot") : selectedPhoto;
        const previous = photos[index - 1];
        const previousLayer = previous.dataset.collageSlot ? previous.closest(".collageSlot") : previous;

      refreshPhotoList();

    // 背景色変更

    /* グラデーション背景を適用 */

      if (story.dataset.bgPreset === name) return;
      if (recordHistory) saveHistory();
      const colors = preset.stops.map(function (stop) {
        return stop.color + " " + stop.at + "%";
      }).join(", ");
      story.style.backgroundImage =
        `linear-gradient(${preset.angle}deg, ${colors})`;

        getComputedStyle(story).backgroundColor

    }    // 画像保存
    async function saveStory() {

          const w = el.naturalWidth * scale;

          }
          const lines = [];
          el.textContent.split("\n").forEach(function (paragraph) {
            if (!paragraph) { lines.push(""); return; }
            let line = "";
            for (const char of paragraph) {

            }

          });

          const badgePadY = Number(el.dataset.badgePadY || 0) * 4;
          if (el.dataset.badgeFill) {

    let photoLayer = "back";
    /* 編集履歴の管理 */

    // 選択中の文字を削除
    function duplicateText() {
      if (!selectedText) {
        alert("複製する文字を選択してください");
        return;
      }
      saveHistory();
      const original = selectedText;
      const copy = original.cloneNode(true);
      // 元の文字と同じIDにならないようにする
      copy.removeAttribute("id");
      copy.classList.remove("selected");
      // 少しずらして重ならないようにする
      const x = Number(original.dataset.x || 0);
      const y = Number(original.dataset.y || 0);
      let nextX = x + 30;
      let nextY = y + 30;
      if (nextX > 90) nextX = -90;
      if (nextY > 160) nextY = -160;
      copy.dataset.x = String(nextX);
      copy.dataset.y = String(nextY);
      storyArea.appendChild(copy);
      setPhotoLayer(photoLayer);
      // 複製した文字もドラッグ・拡大・回転できるようにする
      enableTextDrag(copy);
      updateTextTransform(copy);
      // 複製した文字を選択する
      selectText(copy);
    }

      selectedText = null;

        selectText(remaining);

    // 文字をドラッグできるようにする

    function changeTextColor() {
      if (!selectedText) return;
      selectedText.style.color =
        document.getElementById("textColor").value;
    }
    function changeTextRotation() {
      if (!selectedText) return;
      // ロック中は回転できない
      if (isItemLocked(selectedText)) {
        const currentAngle =
          Number(selectedText.dataset.rotation || 0);
        document.getElementById("textRotation").value =
          Math.max(-180, Math.min(180, currentAngle));
        document.getElementById("rotationValue").textContent =
          Math.round(currentAngle) + "°";
        return;
      }
      const angle =
        Number(document.getElementById("textRotation").value);
      selectedText.dataset.rotation = String(angle);
      document.getElementById("rotationValue").textContent =
        angle + "°";
      updateTextTransform(selectedText);
    }
    function updateTextTransform(el) {
      const x = Number(el.dataset.x || 0);
      const y = Number(el.dataset.y || 0);
      const angle = Number(el.dataset.rotation || 0);
      el.style.transform =
        `translate(calc(-50% + ${x}px), ${y}px) rotate(${angle}deg)`;
      // 文字の位置変更と同時に操作ボタンも移動
      updateItemCornerActions();
    }
    function changeTextSize() {
      if (!selectedText) return;
      // ロック中は文字サイズを変更しない
      if (isItemLocked(selectedText)) {
        document.getElementById("textSize").value =
          parseFloat(getComputedStyle(selectedText).fontSize);
        return;
      }
      selectedText.style.fontSize =
        document.getElementById("textSize").value + "px";
    }
    function changeTextFont() {
      if (!selectedText) return;
      selectedText.style.fontFamily =
        document.getElementById("textFont").value;
    } function changeTextStyle() {
      if (!selectedText) return;
      const outline = document.getElementById("textOutline").checked;
      const shadow = document.getElementById("textShadow").checked;
      const outlineColor = document.getElementById("outlineColor").value;
      const outlineWidth = document.getElementById("outlineWidth").value;
      selectedText.classList.toggle("outline", outline);
      selectedText.classList.toggle("shadow", shadow);
      selectedText.dataset.outlineColor = outlineColor;
      selectedText.dataset.outlineWidth = outlineWidth;
      updateTextOutline(selectedText);
    }
    function updateTextOutline(el) {
      const color = el.dataset.outlineColor || "#333333";
      const width = Number(el.dataset.outlineWidth || 2);
      if (el.classList.contains("outline")) {
        const shadows = [];
        for (let x = -width; x <= width; x++) {
          for (let y = -width; y <= width; y++) {
            if (x * x + y * y <= width * width) {
              shadows.push(`${x}px ${y}px 0 ${color}`);
            }
          }
        }
        el.style.webkitTextStroke = "0px";
        el.style.textShadow = shadows.join(", ");
      } else {
        el.style.textShadow = "";
      }
      if (el.classList.contains("shadow")) {
        const existing = el.style.textShadow;
        el.style.textShadow =
          (existing ? existing + ", " : "") +
          "2px 2px 4px rgba(0,0,0,0.6)";
      }
    } function addTextFromToolbar() {

      document.querySelectorAll(".tabButton").forEach(function (button) { button.classList.remove("active"); });

        editor.classList.remove("panelOpen");
        editor.dataset.activePanel = "";
        return;

      panel.classList.add("active");
      editor.dataset.activePanel = tabName;
      editor.classList.add("panelOpen");
      const dockButton = clickedButton || document.getElementById(tabName === "photo" ? "photoTabButton" : tabName === "text" ? "textTabButton" : tabName === "effect" ? "effectTabButton" : tabName === "decor" ? "decorTabButton" : tabName === "style" ? "styleTabButton" : "");
      if (dockButton) {
        dockButton.classList.add("active");

    /* 編集データの自動保存 */
    let storyDraftDB = null;
    let storyDraftTimer = null;
    let draftSaveWarningShown = false;
    // 現在の編集状態を保存
    function saveStoryDraft() {
      if (!storyDraftDB) return;
      try {
        const state = JSON.stringify(getEditorState());
        const transaction = storyDraftDB.transaction(
          "drafts",
          "readwrite"
        );
        transaction.objectStore("drafts").put(
          state,
          "latest"
        );
        transaction.onerror = function () {
          if (!draftSaveWarningShown) {
            alert("自動保存に失敗しました。写真の容量が大きい可能性があります。");
            draftSaveWarningShown = true;
          }
        };
      } catch (error) {
        console.error("自動保存エラー:", error);
      }
    }
    // 編集が落ち着いてから保存する
    function scheduleStoryDraftSave() {
      clearTimeout(storyDraftTimer);
      storyDraftTimer = setTimeout(function () {
        saveStoryDraft();
      }, 1000);
    }
    // 写真や文字の変更を監視
    function startStoryDraftWatching() {
      const story = document.querySelector(".story");
      const observer = new MutationObserver(function (changes) {
        const contentChanged = changes.some(function (change) {
          const target = change.target.nodeType === Node.ELEMENT_NODE
            ? change.target : change.target.parentElement;
          if (!target) return false;
          if (target.closest(".centerGuide, .edgeGuide, .itemCornerActions")) {
            return false;
          }
          if (change.type === "childList") {
            return [...change.addedNodes, ...change.removedNodes].some(
              function (node) {
                return node.nodeType !== Node.ELEMENT_NODE ||
                  node.matches(".storyPhotoItem, .storyTextItem");
              }
            );
          }
          return target === story ||
            !!target.closest(".storyPhotoItem, .storyTextItem");
        });
        if (contentChanged) scheduleStoryDraftSave();
      });
      observer.observe(story, {
        childList: true,
        attributes: true,
        characterData: true,
        subtree: true
      });
    }
    // 保存用データベースを開く
    function initializeStoryDraft() {
      if (!window.indexedDB) {
        console.warn("このブラウザでは自動保存を利用できません");
        return;
      }
      let request;
      try {
        request = indexedDB.open("StoryPaletteDraftDB", 1);
      } catch (error) {
        console.warn("この環境では自動保存が使えません", error);
        return;
      }
      request.onupgradeneeded = function (event) {
        const db = event.target.result;
        if (!db.objectStoreNames.contains("drafts")) {
          db.createObjectStore("drafts");
        }
      };
      request.onsuccess = function (event) {
        storyDraftDB = event.target.result;
        const transaction = storyDraftDB.transaction(

      const centerX = storyRect.left + storyRect.width / 2;
      const centerY = storyRect.top + storyRect.height / 2;

    /* 中央と四辺への吸着を一度に計算（位置補正を蓄積しない） */
    function snapItemToGuides(item) {
      const storyRect = storyArea.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const scaleX = storyRect.width / storyArea.offsetWidth;
      const scaleY = storyRect.height / storyArea.offsetHeight;
      const marginX = 10 * scaleX;
      const marginY = 10 * scaleY;
      const centerX = storyRect.left + storyRect.width / 2;
      const centerY = storyRect.top + storyRect.height / 2;
      const itemCenterX = itemRect.left + itemRect.width / 2;
      const itemCenterY = itemRect.top + itemRect.height / 2;
      function softSnap(delta) {
        const distance = Math.abs(delta);
        if (distance >= 18) return 0;
        if (distance <= 8) return delta;
        return delta * (18 - distance) / 10;
      }
      const centerDX = centerX - itemCenterX;
      const centerDY = centerY - itemCenterY;
      const leftDiff = storyRect.left + marginX - itemRect.left;
      const rightDiff = storyRect.right - marginX - itemRect.right;
      const topDiff = storyRect.top + marginY - itemRect.top;
      const bottomDiff = storyRect.bottom - marginY - itemRect.bottom;
      // 同じ方向に中央と端が競合しないよう、中央を優先する
      // 大きな写真では中央と端の吸着位置が近すぎる場合がある。
      // 吸着範囲（各18px）が重なる端は候補から除く。
      function eligibleEdge(centerDelta, first, second) {
        const candidates = [first, second].filter(function (delta) {
          return Math.abs(delta - centerDelta) >= 36;
        });
        if (candidates.length === 0) return 0;
        const nearest = candidates.reduce(function (a, b) {
          return Math.abs(a) <= Math.abs(b) ? a : b;
        });
        return softSnap(nearest);
      }
      const dx = Math.abs(centerDX) < 18
        ? softSnap(centerDX)
        : eligibleEdge(centerDX, leftDiff, rightDiff);
      const dy = Math.abs(centerDY) < 18
        ? softSnap(centerDY)
        : eligibleEdge(centerDY, topDiff, bottomDiff);
      if (dx === 0 && dy === 0) return;
      item.dataset.x = String(Number(item.dataset.x || 0) + dx / scaleX);
      item.dataset.y = String(Number(item.dataset.y || 0) + dy / scaleY);
      if (item.classList.contains("storyPhotoItem")) {
        updatePhotoItem(item);
      } else {
        updateTextTransform(item);
      }
    }
    /* 選択した写真・文字を整列する */
    function alignSelectedItem(position) {
      const item =
        document.querySelector(".storyPhotoItem.selected") ||
        document.querySelector(".storyTextItem.selected");
      if (!item) {
        alert("先に写真か文字を選択してください");
        return;

      // ロック中は整列できない
      if (isItemLocked(item)) {
        alert("ロックを解除してから位置を変更してください");
        return;
      }
      const storyRect = storyArea.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      // 編集画面の倍率を取得
      const scaleX = storyRect.width / storyArea.offsetWidth;
      const scaleY = storyRect.height / storyArea.offsetHeight;
      // 画面端から10pxの余白
      const marginX = 10 * scaleX;
      const marginY = 10 * scaleY;
      let dx = 0;
      let dy = 0;
      // 左右の整列
      if (position === "left") {
        dx = storyRect.left + marginX - itemRect.left;
      } else if (position === "centerX") {
        dx = (storyRect.left + storyRect.width / 2) -
          (itemRect.left + itemRect.width / 2);
      } else if (position === "right") {
        dx = storyRect.right - marginX - itemRect.right;
      }
      // 上下の整列
      else if (position === "top") {
        dy = storyRect.top + marginY - itemRect.top;
      } else if (position === "centerY") {
        dy = (storyRect.top + storyRect.height / 2) -
          (itemRect.top + itemRect.height / 2);
      } else if (position === "bottom") {
        dy = storyRect.bottom - marginY - itemRect.bottom;
      }
      // すでに揃っていれば何もしない
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
        return;
      }
      // 移動前の状態を履歴に保存
      saveHistory();
      item.dataset.x = String(

      );
      item.dataset.y = String(
        Number(item.dataset.y || 0) + dy / scaleY
      );

        updatePhotoItem(item);
      } else {
        updateTextTransform(item);
      }

      };
      return details[template.design] || "";
    }
    function makeCollageArtSvg(template) {
      const decor = collageDecorationSvg(template);
      return `<svg xmlns="http://www.w3.org/2000/svg" width="270" height="480" viewBox="0 0 270 480"><defs><linearGradient id="paper" x2=".9" y2="1"><stop stop-color="${template.background}"/><stop offset="1" stop-color="${template.paper}"/></linearGradient><pattern id="grain" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".7" fill="${template.accent}" opacity=".16"/><circle cx="10" cy="8" r=".55" fill="#fff" opacity=".5"/></pattern></defs><rect width="270" height="480" fill="url(#paper)"/><rect width="270" height="480" fill="url(#grain)"/><path d="M0 56H270M0 426H270" stroke="${template.accent}" stroke-opacity=".13" stroke-width="1"/><text x="135" y="20" text-anchor="middle" font-family="sans-serif" font-size="8" letter-spacing="2" fill="${template.accent}" opacity=".8">${template.label}</text><text x="135" y="466" text-anchor="middle" font-family="sans-serif" font-size="9" letter-spacing="1.2" fill="${template.accent}" opacity=".85">${template.motif}</text>${decor}<g fill="${template.accent}" opacity=".68"><path d="M239 42l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M25 244l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/><circle cx="242" cy="394" r="3"/><circle cx="30" cy="75" r="2"/></g></svg>`;
    }

    function collageSlotInsets(slot) {
      if (slot.frame === "polaroid" || slot.frame === "instax") return { top: 6, right: 6, bottom: 25, left: 6 };
      if (slot.frame === "film") return { top: 7, right: 9, bottom: 7, left: 9 };
      return { top: 5, right: 5, bottom: 5, left: 5 };
    }

    function findCollageSlot(templateName, slotId) {
      const template = collageTemplates[templateName];
      return template && template.slots.find(slot => slot.id === String(slotId));
    }

    function drawCollageSlotBases(ctx, templateName) {
      const template = collageTemplates[templateName];
      if (!template) return;
      template.slots.forEach(function (slot) {
        ctx.save();
        ctx.translate((slot.x + slot.w / 2) * 4, (slot.y + slot.h / 2) * 4);
        ctx.rotate(slot.angle * Math.PI / 180);
        ctx.shadowColor = "rgba(45,40,52,.24)";
        ctx.shadowBlur = 28;
        ctx.shadowOffsetX = 3;
        ctx.shadowOffsetY = 12;
        ctx.fillStyle = slot.frame === "film" ? "#282b38" : slot.frame === "paper" ? template.paper : "#fff";
        ctx.fillRect(-slot.w * 2, -slot.h * 2, slot.w * 4, slot.h * 4);
        ctx.restore();
      });
    }

    function drawCollageSlotPhoto(ctx, img) {
      const templateName = document.querySelector(".story").dataset.collageTemplate;
      const slot = findCollageSlot(templateName, img.dataset.collageSlot);
      if (!slot) return;
      const inset = collageSlotInsets(slot);
      const innerW = slot.w - inset.left - inset.right;
      const innerH = slot.h - inset.top - inset.bottom;
      const zoom = Number(img.dataset.size || 100) / 100;
      const scale = Math.max(innerW / img.naturalWidth, innerH / img.naturalHeight) * zoom;
      const drawW = img.naturalWidth * scale;
      const drawH = img.naturalHeight * scale;
      ctx.save();
      ctx.translate((slot.x + slot.w / 2) * 4, (slot.y + slot.h / 2) * 4);
      ctx.rotate(slot.angle * Math.PI / 180);
      ctx.beginPath();
      if (slot.shape === "round") {
        ctx.ellipse((inset.left + innerW / 2 - slot.w / 2) * 4,
          (inset.top + innerH / 2 - slot.h / 2) * 4, innerW * 2, innerH * 2, 0, 0, Math.PI * 2);
      } else {
        ctx.rect((inset.left - slot.w / 2) * 4, (inset.top - slot.h / 2) * 4, innerW * 4, innerH * 4);
      }
      ctx.clip();
      ctx.save();
      ctx.translate(Number(img.dataset.x || 0) * 4, Number(img.dataset.y || 0) * 4);
      ctx.rotate(Number(img.dataset.rotation || 0) * Math.PI / 180);
      ctx.filter = img.style.filter || "none";
      ctx.drawImage(img, -drawW * 2, -drawH * 2, drawW * 4, drawH * 4);
      ctx.restore();
      ctx.restore();
    }

    function drawCollageSlotFrames(ctx, templateName) {
      const template = collageTemplates[templateName];
      if (!template) return;
      template.slots.forEach(function (slot) {
        ctx.save();
        ctx.translate((slot.x + slot.w / 2) * 4, (slot.y + slot.h / 2) * 4);
        ctx.rotate(slot.angle * Math.PI / 180);
        ctx.lineWidth = slot.frame === "film" ? 4 : 3;
        ctx.strokeStyle = slot.frame === "film" ? "#faf7f0" : template.accent + "88";
        const inset = collageSlotInsets(slot);
        if (slot.shape === "round") {
          ctx.beginPath();
          ctx.ellipse((inset.left + (slot.w - inset.left - inset.right) / 2 - slot.w / 2) * 4,
            (inset.top + (slot.h - inset.top - inset.bottom) / 2 - slot.h / 2) * 4,
            (slot.w - inset.left - inset.right) * 2,
            (slot.h - inset.top - inset.bottom) * 2, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.strokeRect((inset.left - slot.w / 2) * 4, (inset.top - slot.h / 2) * 4,
            (slot.w - inset.left - inset.right) * 4, (slot.h - inset.top - inset.bottom) * 4);
        }
        if (slot.frame === "film") {
          ctx.fillStyle = "#faf7f0";
          for (let x = -slot.w * 2 + 10; x < slot.w * 2 - 8; x += 34) {
            ctx.fillRect(x, -slot.h * 2 + 3, 17, 8);
            ctx.fillRect(x, slot.h * 2 - 11, 17, 8);
          }
        }
        ctx.restore();
      });
    }

    function updateCollagePhoto(img) {
      const slotEl = img.closest(".collageSlot");
      const mask = slotEl && slotEl.querySelector(".collagePhotoMask");
      if (!mask || !img.naturalWidth) return;
      const zoom = Number(img.dataset.size || 100) / 100;
      img.style.width = (mask.clientWidth * zoom) + "px";
      img.style.height = (mask.clientHeight * zoom) + "px";
      img.style.left = `calc(50% + ${Number(img.dataset.x || 0)}px)`;
      img.style.top = `calc(50% + ${Number(img.dataset.y || 0)}px)`;
      img.style.transform = `translate(-50%, -50%) rotate(${Number(img.dataset.rotation || 0)}deg)`;
      img.style.objectFit = "cover";
      img.style.zIndex = "1";
      slotEl.classList.add("has-photo");
    }

    function applyCollageTemplate(name, recordHistory = true, keepBackground = false) {
      const template = collageTemplates[name];
      if (!template) return;
      const story = document.querySelector(".story");
      const oldPhotos = [...story.querySelectorAll(".storyPhotoItem")];
      if (recordHistory) saveHistory();
      oldPhotos.forEach(img => img.remove());
      story.querySelectorAll(".collageTemplateArt, .collageSlot").forEach(el => el.remove());
      story.dataset.collageTemplate = name;
      if (!keepBackground) {
        story.style.backgroundColor = template.background;
        story.style.backgroundImage = "none";
        delete story.dataset.bgPreset;
      }
      const art = document.createElement("img");
      art.className = "collageTemplateArt";
      art.alt = "";
      art.draggable = false;
      art.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(makeCollageArtSvg(template));
      story.insertBefore(art, story.firstChild);
      template.slots.forEach(slot => {
        const frame = document.createElement("div");
        frame.className = "collageSlot " + slot.frame + (slot.shape ? " " + slot.shape : "") + (template.tape ? " taped" : "");
        frame.dataset.slotId = slot.id;
        frame.setAttribute("aria-label", "写真枠 " + slot.id);
        frame.style.left = slot.x + "px";
        frame.style.top = slot.y + "px";
        frame.style.width = slot.w + "px";
        frame.style.height = slot.h + "px";
        frame.style.transform = `rotate(${slot.angle}deg)`;
        const mask = document.createElement("div");
        mask.className = "collagePhotoMask";
        const plus = document.createElement("button");
        plus.type = "button";
        plus.className = "slotAddButton";
        plus.textContent = "+";
        plus.setAttribute("aria-label", "写真枠 " + slot.id + " に写真を追加");
        plus.addEventListener("click", function (event) {
          event.stopPropagation();
          photo.dataset.collageTarget = slot.id;
          photo.click();
        });
        frame.append(mask, plus);
        story.appendChild(frame);
      });
      oldPhotos.forEach((img, index) => {
        if (index < template.slots.length) {
          const slot = template.slots[index];
          img.dataset.collageSlot = slot.id;
          img.dataset.x = "0";
          img.dataset.y = "0";
          img.dataset.size = "100";
          img.dataset.rotation = "0";
          const frame = story.querySelector(`.collageSlot[data-slot-id="${slot.id}"]`);
          frame.querySelector(".collagePhotoMask").appendChild(img);
          updateCollagePhoto(img);
        } else {
          delete img.dataset.collageSlot;
          story.appendChild(img);
          updatePhotoItem(img);
        }
      });
      document.querySelectorAll(".collageTemplateChoice").forEach(button => {
        button.classList.toggle("active", button.getAttribute("onclick").includes("'" + name + "'"));
      });
      refreshPhotoList();
      setPhotoLayer(photoLayer);
    }

    /* 世界観スタイルをワンタップで適用 */
    function applyStylePreset(name) {
      const story = document.querySelector(".story");

      const names = {
        heisei: "平成プリ",
        korean: "韓国コラージュ",
        y2k: "Y2Kカメラ"
      };

      if (!names[name]) return;

      // 変更前の状態を1回だけ履歴に保存
      saveHistory();

      // ① 背景グラデーション
      // falseを指定して履歴の二重保存を防ぐ
      applyGradientBackground(name, false);

      // ② 装飾を変更
      story.dataset.decorPreset = name;

      // ③ Y2Kの日時を設定
      if (name === "y2k") {
        if (!story.dataset.y2kTimestamp) {
          const now = new Date();

          const pad = n =>
            String(n).padStart(2, "0");

          story.dataset.y2kTimestamp =
            now.getFullYear() + "." +
            pad(now.getMonth() + 1) + "." +
            pad(now.getDate()) + " " +
            pad(now.getHours()) + ":" +
            pad(now.getMinutes());
        }

        // 初期値がなければ設定
        story.dataset.grainStrength ??= "40";
        story.dataset.y2kLightStrength ??= "45";
      }

      // ④ 追加済みの写真すべてにフィルターを適用
      story.querySelectorAll(
        ".storyPhotoItem"
      ).forEach(function (img) {

        // ロック中の写真は変更しない
        if (isItemLocked(img)) return;

        img.dataset.filterPreset = name;

        // スタイル適用時は100%に設定
        img.dataset.filterStrength = "100";
      });

      // ⑤ 各ボタン・スライダー表示を更新
      updateHeiseiDecorButton();
      updateKoreanDecorButton();
      updateY2KDecorButton();

      updatePhotoFilterButtons();
      updatePhotoFilterStrengthUI();
      updateY2KGrain();
      updateY2KLight();
    }

  </script>
