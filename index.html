<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>StoryPalette</title>

 <style>
    body {
  font-family: sans-serif;
  background: #f8edf2;
  text-align: center;
  padding: 16px;
  margin: 0;
  box-sizing: border-box;
  }

  * {
    box-sizing: border-box;
  }

    
.story {
  width: 270px;
  height: 480px;
  background: #e9dfce;
  margin: 20px auto;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
}

.story img {
  position: absolute;
  left: 50%;
  top: 50%;
  max-width: none;
  max-height: none;
  object-fit: contain;
  touch-action: none;
  cursor: grab;
  user-select: none;
}

#previewText {
  position: absolute;
  left: 50%;
  top: 400px;
  width: max-content;
  max-width: 240px;
  margin: 0;
  padding: 0;
  color: #555555;
  font-size: 15px;
  font-family: sans-serif;
  line-height: 1.2;
  text-align: center;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  touch-action: none;
  cursor: grab;
  user-select: none;
  transform: translateX(-50%);
}
    button {
      margin: 5px;
      padding: 8px 12px;
      cursor: pointer;
    }

    input {
      margin: 10px;
    }
    　
/* 編集タブ */
.editTabs {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin: 20px auto 10px;
  max-width: 360px;
}

.tabButton {
  flex: 1;
  padding: 12px 5px;
  border: none;
  border-radius: 12px 12px 0 0;
  background: #eadde5;
  color: #665260;
  font-size: 14px;
}

.tabButton.active {
  background: white;
  color: #a65d87;
  font-weight: bold;
}

.tabContent {
  display: none;
  background: white;
  padding: 16px 10px;
  border-radius: 12px;
  max-width: 340px;
  margin: 0 auto;
}

.tabContent.active {
  display: block;
}

.tabContent textarea {
  width: 85%;
  max-width: 280px;
  padding: 8px;
  box-sizing: border-box;
}

.saveButton {
  background: #a87898;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 25px;
  font-size: 15px;
}

/* スマホ向けデザイン */
.editTabs {
  width: 100%;
  max-width: 360px;
  gap: 6px;
  padding: 0 4px;
}

.tabButton {
  min-height: 48px;
  margin: 0;
  padding: 12px 4px;
  font-size: 14px;
  border-radius: 12px 12px 0 0;
}

.tabContent {
  width: 100%;
  max-width: 360px;
  padding: 20px 12px;
  border-radius: 0 0 14px 14px;
}

.tabContent p {
  font-size: 14px;
  font-weight: 500;
  color: #665260;
}

.tabContent input[type="range"] {
  width: 85%;
  max-width: 280px;
  accent-color: #a87898;
}

.tabContent input[type="file"] {
  max-width: 100%;
  font-size: 13px;
}

.tabContent select,
.tabContent textarea {
  max-width: 100%;
  font-size: 16px;
  border: 1px solid #e5d6df;
  border-radius: 8px;
  padding: 10px;
}

.tabContent button {
  min-height: 44px;
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  background: #f0e4eb;
  color: #665260;
}

.saveButton {
  display: block;
  width: 100%;
  max-width: 360px;
  min-height: 50px;
  margin: 20px auto;
  border-radius: 12px;
  font-weight: bold;
  font-size: 16px;
  background: #a87898;
  color: white;
}

/* 小さいスマホ向け */
@media (max-width: 360px) {
  body {
    padding: 10px;
  }

  .tabButton {
    font-size: 12px;
  }
}
  
/* 文字の縁取り */
#previewText.outline {
  -webkit-text-stroke: 1px #333333;
  paint-order: stroke fill;
}

/* 文字の影 */
#previewText.shadow {
  text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.6);
}

  </style>
</head>

<body>

  <h1>StoryPalette</h1>
  <p>写真を選んでストーリーを作ろう！</p>
  <div id="editorArea">

    <!-- 編集用ストーリー表示 -->
    <div class="story">
      <img id="preview" alt="" style="display:none;">
      <p id="previewText">My Memories ♡</p>
    </div>
  
    <!-- 編集タブ -->
    <div class="editTabs">
      <button type="button" class="tabButton active"
        onclick="showTab('photo', this)">📷 写真</button>
  
      <button type="button" class="tabButton"
        onclick="showTab('text', this)">✏️ 文字</button>
  
      <button type="button" class="tabButton"
        onclick="showTab('background', this)">🎨 背景</button>
    </div>
      
    <!-- 写真タブ -->
    <div id="photoTab" class="tabContent active">
    <p>写真を選択</p>
    <input type="file" accept="image/*" id="photo">

    <p>写真の大きさ</p>
    <input
     type="range"
     id="photoSize"
     min="50"
     max="150"
     value="100"
     oninput="changeSize()"
    >
    </div>

    <!-- 文字タブ -->
     <div id="textTab" class="tabContent">
     <p>ストーリーに入れる文字</p>
     <textarea
      id="storyText"
      rows="3"
      oninput="changeText()"
     >My Memories ♡</textarea>

     <p>文字の色</p>
      <input
      type="color"
      id="textColor"
      value="#555555"
      oninput="changeTextColor()"
     >
     <p>文字の大きさ</p>
     <input
      type="range"
      id="textSize"
      min="10"
      max="40"
      value="15"
      oninput="changeTextSize()"
     >

     <p>文字のフォント</p>
     <select id="textFont" onchange="changeTextFont()">
     <option value="sans-serif">ゴシック体</option>
     <option value="serif">明朝体</option>
     <option value="cursive">筆記体</option>
     <option value="monospace">等幅フォント</option>
     </select>
     
    <!-- 文字の装飾 -->
    <p>文字の装飾</p>

    <label>
      <input
        type="checkbox"
        id="textOutline"
        onchange="changeTextStyle()"
      >
      縁取りをつける
    </label>

    <br>

    <label>
      <input
        type="checkbox"
        id="textShadow"
        onchange="changeTextStyle()"
      >
      影をつける
    </label> 

     </div>

    
    <!-- 背景タブ -->
    <div id="backgroundTab" class="tabContent">
    <p>背景の色</p>

    <button onclick="changeColor('#f8c8dc')">ピンク</button>
    <button onclick="changeColor('#c8e7ff')">水色</button>
    <button onclick="changeColor('#e9dfce')">ベージュ</button>

    <!-- 自由に背景色を選択 -->
    <p>好きな色を選ぶ</p>
    <input
     type="color"
     id="backgroundColor"
     value="#e9dfce"
     oninput="changeColor(this.value)"
    >
    </div>


    <!-- 保存ボタン（どのタブでも表示） -->
    <br>
    <button onclick="saveStory()" class="saveButton">
    画像を保存する
    </button>

    </div> <!-- editorAreaを閉じる -->

    <!-- 完成画像の表示画面 -->
    <div id="saveArea" style="display:none; margin:20px auto;">

    <p>完成した画像を長押しして保存してね！</p>

    <img
     id="savedImage"
     alt="完成したストーリー"
     style="width:270px; max-width:100%;"
     >

    <br>

    <button onclick="backToEdit()">
     ← 編集に戻る
    </button>

    </div>

    <script>
     const photo = document.getElementById("photo");
     const preview = document.getElementById("preview");

    // 写真を選択
    
photo.addEventListener("change", function () {
  const file = photo.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("画像ファイルを選択してください");
    return;
  }

  const reader = new FileReader();

   
 reader.onload = function (event) {
  preview.onload = function () {
    photoX = 0;
    photoY = 0;

    document.getElementById("photoSize").value = 100;

    updatePhotoPosition();
    preview.style.display = "block";
 };

  preview.src = event.target.result;
};


  reader.onerror = function () {
    alert("写真の読み込みに失敗しました");
  };

  reader.readAsDataURL(file);
});


    // 背景色変更
    function changeColor(color) {
    // ストーリーの背景色を変更
    document.querySelector(".story")
    .style.backgroundColor = color;

    // カラーピッカーの表示色も変更
    document.getElementById("backgroundColor").value = color;
    }

    // 文字変更
    function changeText() {
      const text = document
        .getElementById("storyText").value;

      document
        .getElementById("previewText")
        .textContent = text;
    }

    // 画像保存
    function saveStory() {
      const story = document.querySelector(".story");

      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1920;

      const ctx = canvas.getContext("2d");

      // 背景色
      ctx.fillStyle =
        getComputedStyle(story).backgroundColor;

      ctx.fillRect(0, 0, 1080, 1920);

      
      // 写真
      if (preview.complete && preview.naturalWidth > 0) {
        const photoSize =
          document.getElementById("photoSize").value / 100;

        const scale = Math.min(
          880 / preview.naturalWidth,
          1280 / preview.naturalHeight
        ) * photoSize;

        const w = preview.naturalWidth * scale;
        const h = preview.naturalHeight * scale;

        ctx.drawImage(
          preview,
          (1080 - w) / 2 + photoX * 4,
          (1920 - h) / 2 + photoY * 4,
          w,
          h
        );
      }


      
      // 文字
      const text = document.getElementById("storyText").value;
      const textSize = Number(document.getElementById("textSize").value);
      const textFont = document.getElementById("textFont").value;
      const textColor = document.getElementById("textColor").value;

      ctx.fillStyle = textColor;
      ctx.font = `${textSize * 4}px ${textFont}`;
      ctx.textAlign = "center";
      ctx.textBaseline = "top";

      const maxTextWidth = 960;
      const lineHeight = textSize * 4 * 1.2;
      const textCenterX = 540 + textX * 4;
      const textTopY = 1600 + textY * 4;

      const lines = [];
      const paragraphs = text.split("\n");

      paragraphs.forEach(function(paragraph) {
        if (paragraph === "") {
          lines.push("");
          return;
        }

        let line = "";

        for (const char of paragraph) {
          const testLine = line + char;

          if (ctx.measureText(testLine).width > maxTextWidth && line !== "") {
            lines.push(line);
            line = char;
          } else {
            line = testLine;
          }
        }

        if (line !== "") {
          lines.push(line);
        }
      });

      
   // 文字装飾の設定
   const outlineEnabled =
      document.getElementById("textOutline").checked;

    const shadowEnabled =
      document.getElementById("textShadow").checked;

    ctx.save();

     // 文字の影
     if (shadowEnabled) {
     ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
     ctx.shadowBlur = 12;
      ctx.shadowOffsetX = 8;
      ctx.shadowOffsetY = 8;
    }

     // 文字を1行ずつ描画
    lines.forEach(function(line, index) {
      const y = textTopY + index * lineHeight;

      // 縁取り
     if (outlineEnabled) {
        ctx.lineWidth = 8;
        ctx.strokeStyle = "#333333";
        ctx.lineJoin = "round";
        ctx.strokeText(line, textCenterX, y);
     }

      // 文字本体
      ctx.fillText(line, textCenterX, y);
    });

    ctx.restore();
  
      // 完成画像を生成
      const imageData = canvas.toDataURL("image/png");

      // iPhoneでも保存できるように画像を表示
      const savedImage = document.getElementById("savedImage");
      const saveArea = document.getElementById("saveArea");

      savedImage.src = imageData;
      saveArea.style.display = "block";
      document.getElementById("editorArea").style.display = "none";

      // 保存画面までスクロール
      saveArea.scrollIntoView({ behavior: "smooth" });
    }
    function changeSize() {
     updatePhotoPosition();
    }

     
     function backToEdit() {
      document.getElementById("saveArea").style.display = "none";

      document.getElementById("editorArea").style.display = "block";

      document.getElementById("editorArea").scrollIntoView({
       behavior: "smooth"
    });
 }

let photoX = 0;
let photoY = 0;

let dragging = false;
let startX = 0;
let startY = 0;

preview.addEventListener("pointerdown", function(e) {
  dragging = true;
  startX = e.clientX - photoX;
  startY = e.clientY - photoY;
  preview.setPointerCapture(e.pointerId);
});

preview.addEventListener("pointermove", function(e) {
  if (!dragging) return;

  photoX = e.clientX - startX;
  photoY = e.clientY - startY;

  updatePhotoPosition();
});

preview.addEventListener("pointerup", function() {
  dragging = false;
});

preview.addEventListener("pointercancel", function() {
  dragging = false;
});



function updatePhotoPosition() {
  if (!preview.naturalWidth) return;

  const size =
    document.getElementById("photoSize").value / 100;

  const scale = Math.min(
    220 / preview.naturalWidth,
    320 / preview.naturalHeight
  ) * size;

  const w = preview.naturalWidth * scale;
  const h = preview.naturalHeight * scale;

  preview.style.width = `${w}px`;
  preview.style.height = `${h}px`;

  preview.style.transform =
    `translate(calc(-50% + ${photoX}px), calc(-50% + ${photoY}px))`;
}
  
let textX = 0;
let textY = 0;

let textDragging = false;
let textStartX = 0;
let textStartY = 0;

const previewText = document.getElementById("previewText");

previewText.addEventListener("pointerdown", function(e) {
  textDragging = true;

  textStartX = e.clientX - textX;
  textStartY = e.clientY - textY;

  previewText.setPointerCapture(e.pointerId);
});

previewText.addEventListener("pointermove", function(e) {
  if (!textDragging) return;

  textX = e.clientX - textStartX;
  textY = e.clientY - textStartY;

  previewText.style.transform =
  `translate(calc(-50% + ${textX}px), ${textY}px)`;
});

previewText.addEventListener("pointerup", function() {
  textDragging = false;
});

previewText.addEventListener("pointercancel", function() {
  textDragging = false;
});
function changeTextColor() {
  const color = document.getElementById("textColor").value;
  document.getElementById("previewText").style.color = color;
}
function changeTextSize() {
  const size = document.getElementById("textSize").value;

  document.getElementById("previewText").style.fontSize =
    `${size}px`;
}


function changeTextFont() {
  const font = document.getElementById("textFont").value;

  document.getElementById("previewText").style.fontFamily = font;
}

function changeTextStyle() {
  const outline = document.getElementById("textOutline").checked;
  const shadow = document.getElementById("textShadow").checked;

  const text = document.getElementById("previewText");

  text.classList.toggle("outline", outline);
  text.classList.toggle("shadow", shadow);
}


function showTab(tabName, clickedButton) {
  // すべてのタブ内容を非表示
  document.querySelectorAll(".tabContent").forEach(function(tab) {
    tab.classList.remove("active");
  });

  // すべてのタブボタンの選択状態を解除
  document.querySelectorAll(".tabButton").forEach(function(button) {
    button.classList.remove("active");
  });

  // 選択したタブを表示
  document.getElementById(tabName + "Tab").classList.add("active");

  // 押したボタンを選択状態にする
  clickedButton.classList.add("active");
}

  </script>

</body>
</html>
